name: Windows RDP + Tailscale

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Duración de la sesión RDP en minutos"
        required: true
        default: "60"
        type: choice
        options:
          - "5"
          - "10"
          - "15"
          - "30"
          - "45"
          - "60"
          - "90"
          - "120"
          - "150"
          - "180"
          - "210"
          - "240"
          - "270"
          - "300"
          - "330"

jobs:
  rdp:
    name: Windows RDP
    runs-on: windows-2025
    timeout-minutes: 360

    permissions:
      id-token: write
      contents: read
      actions: read

    env:
      RDP_USERNAME: Roxisk
      PERSISTENT_DIR: C:\Persistent
      BACKUP_DIR: C:\PersistentBackup

    steps:

      # ============================================================
      # 1. CONFIGURAR RDP
      # ============================================================

      - name: Configure RDP
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host " CONFIGURANDO RDP"
          Write-Host "========================================"

          $username = $env:RDP_USERNAME
          $password = $env:RDP_PASSWORD

          if ([string]::IsNullOrWhiteSpace($password)) {
              throw "RDP_PASSWORD no está configurado."
          }

          # Crear usuario si no existe
          $user = Get-LocalUser -Name $username -ErrorAction SilentlyContinue

          if (-not $user) {
              Write-Host "Creando usuario $username..."
              $securePassword = ConvertTo-SecureString $password -AsPlainText -Force

              New-LocalUser `
                -Name $username `
                -Password $securePassword `
                -FullName $username `
                -Description "Temporary RDP user"

              Write-Host "Usuario creado."
          }
          else {
              Write-Host "El usuario $username ya existe."

              $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
              Set-LocalUser -Name $username -Password $securePassword
          }

          # Activar usuario
          Enable-LocalUser -Name $username

          # Agregar a Remote Desktop Users
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          # Administrador
          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction SilentlyContinue

          # Activar Remote Desktop
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          # Permitir RDP en firewall
          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          # Asegurar servicio
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Write-Host ""
          Write-Host "RDP configurado correctamente."
          Write-Host "Usuario: $username"

      # ============================================================
      # 2. BUSCAR BACKUP ANTERIOR
      # ============================================================

      - name: Find previous backup
        id: previous-backup
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host " BUSCANDO BACKUP ANTERIOR"
          Write-Host "========================================"

          $repo = $env:GITHUB_REPOSITORY
          $currentRun = [int64]$env:GITHUB_RUN_ID

          $headers = @{
            "Accept"               = "application/vnd.github+json"
            "Authorization"        = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2026-03-10"
          }

          $runsUrl = "https://api.github.com/repos/$repo/actions/runs?per_page=20"

          Write-Host "Consultando ejecuciones anteriores..."

          $runsResponse = Invoke-RestMethod `
            -Uri $runsUrl `
            -Headers $headers `
            -Method Get

          $candidateRuns = @(
            $runsResponse.workflow_runs |
              Where-Object {
                $_.id -ne $currentRun -and
                $_.name -eq "Windows RDP + Tailscale" -and
                $_.status -eq "completed"
              } |
              Sort-Object -Property created_at -Descending
          )

          $selectedArtifact = $null

          foreach ($run in $candidateRuns) {

            Write-Host "Revisando run $($run.id)..."

            $artifactUrl = "https://api.github.com/repos/$repo/actions/runs/$($run.id)/artifacts?per_page=100"

            try {
              $runArtifacts = Invoke-RestMethod `
                -Uri $artifactUrl `
                -Headers $headers `
                -Method Get
            }
            catch {
              Write-Host "No se pudieron consultar los artefactos de este run."
              continue
            }

            $matchingArtifacts = @(
              $runArtifacts.artifacts |
                Where-Object {
                  $_.expired -eq $false -and
                  (
                    $_.name -like "windows-user-data-checkpoint-*" -or
                    $_.name -eq "windows-user-data"
                  )
                } |
                Sort-Object -Property created_at -Descending
            )

            if ($matchingArtifacts.Count -gt 0) {
              $selectedArtifact = $matchingArtifacts[0]

              Write-Host ""
              Write-Host "BACKUP ENCONTRADO"
              Write-Host "Run: $($run.id)"
              Write-Host "Artifact: $($selectedArtifact.name)"
              Write-Host "Artifact ID: $($selectedArtifact.id)"
              Write-Host ""

              break
            }
          }

          if (-not $selectedArtifact) {
            Write-Host "No existe ningún backup anterior disponible."
            "found=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          $downloadUrl = "https://api.github.com/repos/$repo/actions/artifacts/$($selectedArtifact.id)/zip"
          $zipPath = Join-Path $env:RUNNER_TEMP "previous-backup.zip"
          $extractPath = Join-Path $env:RUNNER_TEMP "previous-backup"

          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          if (Test-Path $extractPath) {
            Remove-Item $extractPath -Recurse -Force
          }

          Write-Host "Descargando backup..."

          Invoke-WebRequest `
            -Uri $downloadUrl `
            -Headers $headers `
            -OutFile $zipPath

          New-Item -ItemType Directory -Path $extractPath -Force | Out-Null

          Expand-Archive `
            -Path $zipPath `
            -DestinationPath $extractPath `
            -Force

          "found=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "path=$extractPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          Write-Host "Backup descargado correctamente."

      # ============================================================
      # 3. RESTAURAR DATOS
      # ============================================================

      - name: Restore persistent user data
        if: ${{ steps.previous-backup.outputs.found == 'true' }}
        shell: powershell
        env:
          BACKUP_SOURCE: ${{ steps.previous-backup.outputs.path }}
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "========================================"
          Write-Host " RESTAURANDO DATOS"
          Write-Host "========================================"

          $username = $env:RDP_USERNAME
          $profile = "C:\Users\$username"
          $source = $env:BACKUP_SOURCE

          if (-not (Test-Path $source)) {
              Write-Host "No se encontró el directorio del backup."
              exit 0
          }

          New-Item -ItemType Directory `
            -Path $env:PERSISTENT_DIR `
            -Force | Out-Null

          # --------------------------------------------------------
          # Restaurar carpetas personales
          # --------------------------------------------------------

          $folders = @(
            "Desktop",
            "Documents",
            "Downloads",
            "Pictures"
          )

          foreach ($folder in $folders) {

            $src = Join-Path $source $folder
            $dst = Join-Path $profile $folder

            if (Test-Path $src) {

              Write-Host "Restaurando $folder..."

              New-Item -ItemType Directory `
                -Path $dst `
                -Force | Out-Null

              robocopy `
                $src `
                $dst `
                /E `
                /COPY:DAT `
                /DCOPY:DAT `
                /R:1 `
                /W:1 `
                /XJ `
                /NFL `
                /NDL `
                /NP

              Write-Host "$folder restaurado."
            }
          }

          # --------------------------------------------------------
          # AccountPictures
          # --------------------------------------------------------

          $accountPicturesSource = Join-Path `
            $source `
            "AccountPictures"

          $accountPicturesDestination = Join-Path `
            $profile `
            "AppData\Roaming\Microsoft\Windows\AccountPictures"

          if (Test-Path $accountPicturesSource) {

            Write-Host "Restaurando imagen de cuenta..."

            New-Item -ItemType Directory `
              -Path $accountPicturesDestination `
              -Force | Out-Null

            robocopy `
              $accountPicturesSource `
              $accountPicturesDestination `
              /E `
              /COPY:DAT `
              /DCOPY:DAT `
              /R:1 `
              /W:1 `
              /XJ `
              /NFL `
              /NDL `
              /NP
          }

          # --------------------------------------------------------
          # Themes
          # --------------------------------------------------------

          $themeSource = Join-Path $source "Themes"

          $themeDestination = Join-Path `
            $profile `
            "AppData\Roaming\Microsoft\Windows\Themes"

          if (Test-Path $themeSource) {

            Write-Host "Restaurando temas..."

            New-Item -ItemType Directory `
              -Path $themeDestination `
              -Force | Out-Null

            robocopy `
              $themeSource `
              $themeDestination `
              /E `
              /COPY:DAT `
              /DCOPY:DAT `
              /R:1 `
              /W:1 `
              /XJ `
              /NFL `
              /NDL `
              /NP
          }

          # --------------------------------------------------------
          # ThemeCache
          # --------------------------------------------------------

          $themeCacheSource = Join-Path $source "ThemeCache"

          $themeCacheDestination = Join-Path `
            $profile `
            "AppData\Local\Microsoft\Windows\Themes"

          if (Test-Path $themeCacheSource) {

            Write-Host "Restaurando cache de temas..."

            New-Item -ItemType Directory `
              -Path $themeCacheDestination `
              -Force | Out-Null

            robocopy `
              $themeCacheSource `
              $themeCacheDestination `
              /E `
              /COPY:DAT `
              /DCOPY:DAT `
              /R:1 `
              /W:1 `
              /XJ `
              /NFL `
              /NDL `
              /NP
          }

          # --------------------------------------------------------
          # REGISTRO DEL USUARIO
          # --------------------------------------------------------

          $registryFolder = Join-Path $source "Registry"

          if (Test-Path $registryFolder) {

            Write-Host ""
            Write-Host "Restaurando configuraciones del registro..."

            $sid = (
              Get-CimInstance Win32_UserAccount |
                Where-Object {
                  $_.Name -eq $username -and
                  $_.LocalAccount -eq $true
                } |
                Select-Object -ExpandProperty SID -First 1
            )

            if ($sid) {

              $hkuPath = "Registry::HKEY_USERS\$sid"

              if (Test-Path $hkuPath) {

                Write-Host "La sesión del usuario ya tiene el hive cargado."

                Get-ChildItem $registryFolder -Filter "*.reg" |
                  ForEach-Object {

                    Write-Host "Importando $($_.Name)..."

                    reg.exe import $_.FullName
                  }
              }
              else {

                $ntuser = Join-Path $profile "NTUSER.DAT"

                if (Test-Path $ntuser) {

                  Write-Host "Cargando NTUSER.DAT temporalmente..."

                  reg.exe load "HKU\RoxiskPersist" $ntuser | Out-Null

                  if ($LASTEXITCODE -eq 0) {

                    Get-ChildItem $registryFolder -Filter "*.reg" |
                      ForEach-Object {

                        Write-Host "Importando $($_.Name)..."

                        reg.exe import $_.FullName
                      }

                    reg.exe unload "HKU\RoxiskPersist" | Out-Null
                  }
                  else {
                    Write-Host "No se pudo cargar NTUSER.DAT."
                  }
                }
              }
            }
          }

          Write-Host ""
          Write-Host "Restauración terminada."

      # ============================================================
      # 4. TAILSCALE
      # ============================================================

      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      # ============================================================
      # 5. VERIFICAR RDP + TAILSCALE
      # ============================================================

      - name: Verify Tailscale and RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host " VERIFICANDO TAILSCALE + RDP"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Tailscale IPv4:"

          tailscale ip -4

          Write-Host ""
          Write-Host "Estado de TermService:"

          Get-Service TermService |
            Select-Object Status, Name, DisplayName

          Write-Host ""
          Write-Host "Puerto TCP 3389:"

          $test = Test-NetConnection `
            -ComputerName 127.0.0.1 `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $test.TcpTestSucceeded) {
            throw "El puerto TCP 3389 no está disponible."
          }

          Write-Host "TCP 3389: OK"

          Write-Host ""
          Write-Host "========================================"
          Write-Host " RDP LISTO"
          Write-Host "========================================"

      # ============================================================
      # 6. CREAR SCRIPT DE BACKUP
      # ============================================================

      - name: Create backup script
        shell: powershell
        run: |
          $scriptPath = Join-Path $env:RUNNER_TEMP "Prepare-PersistentBackup.ps1"

          @'
          $ErrorActionPreference = "Continue"

          $username = $env:RDP_USERNAME
          $profile = "C:\Users\$username"
          $backup = $env:BACKUP_DIR

          Write-Host "========================================"
          Write-Host " CREANDO CHECKPOINT"
          Write-Host "========================================"

          if (Test-Path $backup) {
              Remove-Item $backup -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $backup `
            -Force | Out-Null

          # --------------------------------------------------------
          # Carpetas personales
          # --------------------------------------------------------

          $folders = @(
            "Desktop",
            "Documents",
            "Downloads",
            "Pictures"
          )

          foreach ($folder in $folders) {

            $src = Join-Path $profile $folder
            $dst = Join-Path $backup $folder

            if (Test-Path $src) {

              Write-Host "Guardando $folder..."

              New-Item `
                -ItemType Directory `
                -Path $dst `
                -Force | Out-Null

              robocopy `
                $src `
                $dst `
                /E `
                /COPY:DAT `
                /DCOPY:DAT `
                /R:1 `
                /W:1 `
                /XJ `
                /NFL `
                /NDL `
                /NP
            }
          }

          # --------------------------------------------------------
          # Imagen de cuenta
          # --------------------------------------------------------

          $accountPictures = Join-Path `
            $profile `
            "AppData\Roaming\Microsoft\Windows\AccountPictures"

          if (Test-Path $accountPictures) {

            $dst = Join-Path $backup "AccountPictures"

            New-Item `
              -ItemType Directory `
              -Path $dst `
              -Force | Out-Null

            robocopy `
              $accountPictures `
              $dst `
              /E `
              /COPY:DAT `
              /DCOPY:DAT `
              /R:1 `
              /W:1 `
              /XJ `
              /NFL `
              /NDL `
              /NP
          }

          # --------------------------------------------------------
          # Tema
          # --------------------------------------------------------

          $themes = Join-Path `
            $profile `
            "AppData\Roaming\Microsoft\Windows\Themes"

          if (Test-Path $themes) {

            $dst = Join-Path $backup "Themes"

            New-Item `
              -ItemType Directory `
              -Path $dst `
              -Force | Out-Null

            robocopy `
              $themes `
              $dst `
              /E `
              /COPY:DAT `
              /DCOPY:DAT `
              /R:1 `
              /W:1 `
              /XJ `
              /NFL `
              /NDL `
              /NP
          }

          # --------------------------------------------------------
          # Cache del tema
          # --------------------------------------------------------

          $themeCache = Join-Path `
            $profile `
            "AppData\Local\Microsoft\Windows\Themes"

          if (Test-Path $themeCache) {

            $dst = Join-Path $backup "ThemeCache"

            New-Item `
              -ItemType Directory `
              -Path $dst `
              -Force | Out-Null

            robocopy `
              $themeCache `
              $dst `
              /E `
              /COPY:DAT `
              /DCOPY:DAT `
              /R:1 `
              /W:1 `
              /XJ `
              /NFL `
              /NDL `
              /NP
          }

          # --------------------------------------------------------
          # REGISTRO
          # --------------------------------------------------------

          $registryBackup = Join-Path $backup "Registry"

          New-Item `
            -ItemType Directory `
            -Path $registryBackup `
            -Force | Out-Null

          $ntuser = Join-Path $profile "NTUSER.DAT"

          $sid = (
            Get-CimInstance Win32_UserAccount |
              Where-Object {
                $_.Name -eq $username -and
                $_.LocalAccount -eq $true
              } |
              Select-Object -ExpandProperty SID -First 1
          )

          $loaded = $false

          if ($sid) {

            $loadedPath = "Registry::HKEY_USERS\$sid"

            if (Test-Path $loadedPath) {

              Write-Host "El hive de $username ya está cargado."

              $loaded = $true
            }
          }

          if ($loaded) {

            reg.exe export `
              "HKEY_USERS\$sid\Control Panel\Desktop" `
              (Join-Path $registryBackup "Desktop.reg") `
              /y | Out-Null

            reg.exe export `
              "HKEY_USERS\$sid\Software\Microsoft\Windows\CurrentVersion\Themes" `
              (Join-Path $registryBackup "Themes.reg") `
              /y | Out-Null

            reg.exe export `
              "HKEY_USERS\$sid\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" `
              (Join-Path $registryBackup "Personalize.reg") `
              /y | Out-Null

            reg.exe export `
              "HKEY_USERS\$sid\Software\Microsoft\Windows\CurrentVersion\Explorer\Wallpapers" `
              (Join-Path $registryBackup "Wallpapers.reg") `
              /y | Out-Null

            reg.exe export `
              "HKEY_USERS\$sid\Software\Microsoft\Windows\CurrentVersion\Explorer\Accent" `
              (Join-Path $registryBackup "Accent.reg") `
              /y | Out-Null

            reg.exe export `
              "HKEY_USERS\$sid\Software\Microsoft\Windows\DWM" `
              (Join-Path $registryBackup "DWM.reg") `
              /y | Out-Null
          }
          elseif (Test-Path $ntuser) {

            Write-Host "Cargando NTUSER.DAT temporalmente..."

            reg.exe load `
              "HKU\RoxiskPersist" `
              $ntuser | Out-Null

            if ($LASTEXITCODE -eq 0) {

              reg.exe export `
                "HKEY_USERS\RoxiskPersist\Control Panel\Desktop" `
                (Join-Path $registryBackup "Desktop.reg") `
                /y | Out-Null

              reg.exe export `
                "HKEY_USERS\RoxiskPersist\Software\Microsoft\Windows\CurrentVersion\Themes" `
                (Join-Path $registryBackup "Themes.reg") `
                /y | Out-Null

              reg.exe export `
                "HKEY_USERS\RoxiskPersist\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" `
                (Join-Path $registryBackup "Personalize.reg") `
                /y | Out-Null

              reg.exe export `
                "HKEY_USERS\RoxiskPersist\Software\Microsoft\Windows\CurrentVersion\Explorer\Wallpapers" `
                (Join-Path $registryBackup "Wallpapers.reg") `
                /y | Out-Null

              reg.exe export `
                "HKEY_USERS\RoxiskPersist\Software\Microsoft\Windows\CurrentVersion\Explorer\Accent" `
                (Join-Path $registryBackup "Accent.reg") `
                /y | Out-Null

              reg.exe export `
                "HKEY_USERS\RoxiskPersist\Software\Microsoft\Windows\DWM" `
                (Join-Path $registryBackup "DWM.reg") `
                /y | Out-Null

              reg.exe unload "HKU\RoxiskPersist" | Out-Null
            }
            else {
              Write-Host "No se pudo cargar NTUSER.DAT."
            }
          }

          Write-Host ""
          Write-Host "Checkpoint preparado."

          '@ | Set-Content `
            -Path $scriptPath `
            -Encoding UTF8

          Write-Host "Script creado en:"
          Write-Host $scriptPath

      # ============================================================
      # 7. MANTENER LA SESIÓN RDP VIVA
      # ============================================================

      - name: Keep RDP session alive
        id: keep-session
        shell: powershell
        background: true
        timeout-minutes: 350
        env:
          DURATION_MINUTES: ${{ inputs.duration_minutes }}
        run: |
          $minutes = [int]$env:DURATION_MINUTES

          Write-Host "========================================"
          Write-Host " SESIÓN RDP ACTIVA"
          Write-Host " Duración: $minutes minutos"
          Write-Host "========================================"

          Start-Sleep -Seconds ($minutes * 60)

          Write-Host "Tiempo de sesión terminado."

      # ============================================================
      # 8. CHECKPOINT 45 MIN
      # ============================================================

      - name: Checkpoint 45 minutes
        if: ${{ fromJSON(inputs.duration_minutes) >= 45 }}
        shell: powershell
        run: |
          Start-Sleep -Seconds (45 * 60)

          & "$env:RUNNER_TEMP\Prepare-PersistentBackup.ps1"

      - name: Upload checkpoint 01
        if: ${{ fromJSON(inputs.duration_minutes) >= 45 }}
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: windows-user-data-checkpoint-01
          path: C:\PersistentBackup
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      # ============================================================
      # 9. CHECKPOINT 90 MIN
      # ============================================================

      - name: Checkpoint 90 minutes
        if: ${{ fromJSON(inputs.duration_minutes) >= 90 }}
        shell: powershell
        run: |
          Start-Sleep -Seconds (45 * 60)

          & "$env:RUNNER_TEMP\Prepare-PersistentBackup.ps1"

      - name: Upload checkpoint 02
        if: ${{ fromJSON(inputs.duration_minutes) >= 90 }}
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: windows-user-data-checkpoint-02
          path: C:\PersistentBackup
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      # ============================================================
      # 10. CHECKPOINT 135 MIN
      # ============================================================

      - name: Checkpoint 135 minutes
        if: ${{ fromJSON(inputs.duration_minutes) >= 135 }}
        shell: powershell
        run: |
          Start-Sleep -Seconds (45 * 60)

          & "$env:RUNNER_TEMP\Prepare-PersistentBackup.ps1"

      - name: Upload checkpoint 03
        if: ${{ fromJSON(inputs.duration_minutes) >= 135 }}
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: windows-user-data-checkpoint-03
          path: C:\PersistentBackup
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      # ============================================================
      # 11. CHECKPOINT 180 MIN
      # ============================================================

      - name: Checkpoint 180 minutes
        if: ${{ fromJSON(inputs.duration_minutes) >= 180 }}
        shell: powershell
        run: |
          Start-Sleep -Seconds (45 * 60)

          & "$env:RUNNER_TEMP\Prepare-PersistentBackup.ps1"

      - name: Upload checkpoint 04
        if: ${{ fromJSON(inputs.duration_minutes) >= 180 }}
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: windows-user-data-checkpoint-04
          path: C:\PersistentBackup
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      # ============================================================
      # 12. CHECKPOINT 225 MIN
      # ============================================================

      - name: Checkpoint 225 minutes
        if: ${{ fromJSON(inputs.duration_minutes) >= 225 }}
        shell: powershell
        run: |
          Start-Sleep -Seconds (45 * 60)

          & "$env:RUNNER_TEMP\Prepare-PersistentBackup.ps1"

      - name: Upload checkpoint 05
        if: ${{ fromJSON(inputs.duration_minutes) >= 225 }}
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: windows-user-data-checkpoint-05
          path: C:\PersistentBackup
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      # ============================================================
      # 13. CHECKPOINT 270 MIN
      # ============================================================

      - name: Checkpoint 270 minutes
        if: ${{ fromJSON(inputs.duration_minutes) >= 270 }}
        shell: powershell
        run: |
          Start-Sleep -Seconds (45 * 60)

          & "$env:RUNNER_TEMP\Prepare-PersistentBackup.ps1"

      - name: Upload checkpoint 06
        if: ${{ fromJSON(inputs.duration_minutes) >= 270 }}
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: windows-user-data-checkpoint-06
          path: C:\PersistentBackup
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      # ============================================================
      # 14. CHECKPOINT 315 MIN
      # ============================================================

      - name: Checkpoint 315 minutes
        if: ${{ fromJSON(inputs.duration_minutes) >= 315 }}
        shell: powershell
        run: |
          Start-Sleep -Seconds (45 * 60)

          & "$env:RUNNER_TEMP\Prepare-PersistentBackup.ps1"

      - name: Upload checkpoint 07
        if: ${{ fromJSON(inputs.duration_minutes) >= 315 }}
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: windows-user-data-checkpoint-07
          path: C:\PersistentBackup
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      # ============================================================
      # 15. CHECKPOINT FINAL
      # ============================================================

      - name: Final checkpoint
        shell: powershell
        env:
          DURATION_MINUTES: ${{ inputs.duration_minutes }}
        run: |
          $minutes = [int]$env:DURATION_MINUTES

          $checkpointTimes = @(45, 90, 135, 180, 225, 270, 315)

          $lastCheckpoint = 0

          foreach ($checkpoint in $checkpointTimes) {
              if ($minutes -ge $checkpoint) {
                  $lastCheckpoint = $checkpoint
              }
          }

          $remaining = $minutes - $lastCheckpoint

          if ($remaining -gt 0) {
              Write-Host "Esperando $remaining minutos hasta el checkpoint final..."
              Start-Sleep -Seconds ($remaining * 60)
          }

          & "$env:RUNNER_TEMP\Prepare-PersistentBackup.ps1"

      - name: Upload final checkpoint
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: windows-user-data-checkpoint-final
          path: C:\PersistentBackup
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      # ============================================================
      # 16. TERMINAR SESIÓN
      # ============================================================

      - name: Finish RDP session
        wait: keep-session
