name: Windows RDP + Tailscale

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Tiempo de la sesión RDP (5-330 minutos)"
        required: true
        default: "60"
        type: string

jobs:
  rdp:
    # GitHub-hosted Windows runner: temporary VM created for this job.
    runs-on: windows-2025
    timeout-minutes: 360

    permissions:
      id-token: write
      contents: read

    env:
      RDP_USERNAME: rdpuser

    steps:
      - name: Configure RDP
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $minutes = [int]"${{ inputs.duration_minutes }}"

          if ($minutes -lt 5 -or $minutes -gt 330) {
            throw "duration_minutes debe estar entre 5 y 330."
          }

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Falta el secret RDP_PASSWORD en Settings > Secrets and variables > Actions."
          }

          $securePassword = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          $existing = Get-LocalUser `
            -Name $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          if ($null -eq $existing) {
            New-LocalUser `
              -Name $env:RDP_USERNAME `
              -Password $securePassword `
              -AccountNeverExpires `
              -PasswordNeverExpires `
              -UserMayNotChangePassword `
              -Description "Temporary GitHub Actions RDP user"
          }
          else {
            Set-LocalUser `
              -Name $env:RDP_USERNAME `
              -Password $securePassword

            Enable-LocalUser `
              -Name $env:RDP_USERNAME
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          # Enable Remote Desktop.
          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Type DWord `
            -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Type DWord `
            -Value 1

          Set-Service `
            -Name TermService `
            -StartupType Automatic

          Start-Service `
            -Name TermService `
            -ErrorAction SilentlyContinue

          # Enable Windows Firewall rules for Remote Desktop.
          Get-NetFirewallRule `
            -DisplayGroup 'Remote Desktop' `
            -ErrorAction SilentlyContinue |
            Enable-NetFirewallRule `
            -ErrorAction SilentlyContinue

          # Additional RDP firewall rule.
          if (-not (Get-NetFirewallRule `
            -DisplayName 'GitHub RDP 3389' `
            -ErrorAction SilentlyContinue)) {

            New-NetFirewallRule `
              -DisplayName 'GitHub RDP 3389' `
              -Direction Inbound `
              -Protocol TCP `
              -LocalPort 3389 `
              -Action Allow `
              -Profile Any |
              Out-Null
          }

          # Keep the password out of logs.
          Write-Output "RDP_USER=$env:RDP_USERNAME" >> $env:GITHUB_ENV

      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      - name: Verify Tailscale and RDP
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host " VERIFICANDO TAILSCALE"
          Write-Host "========================================"

          $ipOutput = @(tailscale ip -4 2>&1)

          Write-Host "Salida de Tailscale:"
          $ipOutput | ForEach-Object {
            Write-Host $_
          }

          # Buscar una IPv4 válida dentro de la salida.
          $ip = $null

          foreach ($line in $ipOutput) {
            $text = "$line".Trim()

            if ($text -match '^\d{1,3}(\.\d{1,3}){3}$') {
              $ip = $text
              break
            }
          }

          if ([string]::IsNullOrWhiteSpace($ip)) {
            Write-Host ""
            Write-Host "ERROR: No se obtuvo una IPv4 de Tailscale."
            Write-Host ""
            Write-Host "Estado de Tailscale:"
            tailscale status

            throw "No se obtuvo una IPv4 de Tailscale."
          }

          Write-Host ""
          Write-Host "IPv4 de Tailscale detectada: $ip"

          Write-Host ""
          Write-Host "========================================"
          Write-Host " VERIFICANDO SERVICIO RDP"
          Write-Host "========================================"

          $rdpService = Get-Service `
            -Name TermService `
            -ErrorAction SilentlyContinue

          if ($null -eq $rdpService) {
            throw "No existe el servicio TermService."
          }

          Write-Host "Estado de TermService: $($rdpService.Status)"

          if ($rdpService.Status -ne 'Running') {
            Write-Host "Intentando iniciar TermService..."

            Start-Service `
              -Name TermService `
              -ErrorAction SilentlyContinue

            Start-Sleep -Seconds 3

            $rdpService = Get-Service `
              -Name TermService

            Write-Host "Nuevo estado de TermService: $($rdpService.Status)"
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host " VERIFICANDO PUERTO RDP"
          Write-Host "========================================"

          $rdpReady = $false

          for ($i = 1; $i -le 15; $i++) {

            $tcp = Test-NetConnection `
              -ComputerName '127.0.0.1' `
              -Port 3389 `
              -WarningAction SilentlyContinue

            Write-Host "Intento $i/15 - TCP 3389: $($tcp.TcpTestSucceeded)"

            if ($tcp.TcpTestSucceeded) {
              $rdpReady = $true
              break
            }

            Start-Sleep -Seconds 2
          }

          if (-not $rdpReady) {

            Write-Host ""
            Write-Host "ERROR: RDP no está escuchando en TCP 3389."

            Write-Host ""
            Write-Host "Conexiones TCP en escucha:"

            Get-NetTCPConnection `
              -State Listen `
              -ErrorAction SilentlyContinue |
              Sort-Object LocalPort |
              Format-Table -AutoSize

            Write-Host ""
            Write-Host "Reglas de Firewall RDP:"

            Get-NetFirewallRule `
              -DisplayGroup 'Remote Desktop' `
              -ErrorAction SilentlyContinue |
              Select-Object DisplayName, Enabled, Direction, Action |
              Format-Table -AutoSize

            throw "RDP (TCP 3389) no está escuchando en el runner."
          }

          Write-Host ""
          Write-Host "RDP está escuchando correctamente en TCP 3389."

          # Guardar únicamente la IPv4 de Tailscale.
          "TAILSCALE_IPV4=$ip" >> $env:GITHUB_ENV

          # Crear resumen visible en GitHub Actions.
          $summary = @"
          ## Windows RDP listo

          **PC / Tailscale IPv4:** ${ip}:3389

          **Usuario:** $env:RDP_USERNAME

          **Contraseña:** usa el valor del secret ``RDP_PASSWORD``.

          ### Conexión

          En **Windows App**, agrega un PC usando:

          `${ip}:3389`

          Tu teléfono o PC también debe estar conectado al mismo tailnet.

          ### Estado

          - Tailscale: conectado
          - IPv4: ${ip}
          - RDP: TCP 3389 escuchando
          - Usuario: $env:RDP_USERNAME
          "@

          Add-Content `
            -Path $env:GITHUB_STEP_SUMMARY `
            -Value $summary

          Write-Host ""
          Write-Host "========================================"
          Write-Host " RDP LISTO"
          Write-Host "========================================"
          Write-Host "Tailscale IPv4: $ip"
          Write-Host "Dirección RDP: ${ip}:3389"
          Write-Host "Usuario: $env:RDP_USERNAME"
          Write-Host ""
          Write-Host "VERIFICACIÓN COMPLETADA CORRECTAMENTE."

      - name: Keep session alive
        shell: pwsh
        run: |
          $minutes = [int]"${{ inputs.duration_minutes }}"

          Write-Host "Sesión RDP activa durante $minutes minutos."
          Write-Host "Cancela el workflow para terminarla antes."

          $deadline = (Get-Date).AddMinutes($minutes)

          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 30
          }

      - name: Session finished
        if: always()
        shell: pwsh
        run: |
          Write-Host "La sesión terminó."
          Write-Host "GitHub destruirá el runner al finalizar el job."
