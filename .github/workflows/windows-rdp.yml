name: Windows RDP + Tailscale

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Tiempo de la sesión RDP (5-330 minutos)"
        required: true
        default: "60"
        type: string

jobs:
  rdp:
    # GitHub-hosted Windows runner: temporary VM created for this job.
    runs-on: windows-2025
    timeout-minutes: 360

    permissions:
      id-token: write
      contents: read
      actions: read

    env:
      RDP_USERNAME: Roxisk
      PERSISTENT_DIR: C:\Persistent
      BACKUP_DIR: C:\PersistentBackup

    steps:

      # ============================================================
      # 1. CONFIGURAR RDP
      # ============================================================

      - name: Configure RDP
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $minutes = [int]"${{ inputs.duration_minutes }}"

          if ($minutes -lt 5 -or $minutes -gt 330) {
            throw "duration_minutes debe estar entre 5 y 330."
          }

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Falta el secret RDP_PASSWORD en Settings > Secrets and variables > Actions."
          }

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser `
            -Name $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          if ($null -eq $existing) {

            New-LocalUser `
              -Name $env:RDP_USERNAME `
              -Password $securePassword `
              -AccountNeverExpires `
              -PasswordNeverExpires `
              -UserMayNotChangePassword `
              -Description "Temporary GitHub Actions RDP administrator"

          }
          else {

            Set-LocalUser `
              -Name $env:RDP_USERNAME `
              -Password $securePassword

            Enable-LocalUser `
              -Name $env:RDP_USERNAME
          }

          # ========================================================
          # AGREGAR USUARIO A RDP
          # ========================================================

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          # ========================================================
          # AGREGAR USUARIO A ADMINISTRATORS
          # ========================================================

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          # ========================================================
          # CREAR CARPETA DE PERSISTENCIA
          # ========================================================

          New-Item `
            -ItemType Directory `
            -Path $env:PERSISTENT_DIR `
            -Force |
            Out-Null

          # ========================================================
          # ACTIVAR REMOTE DESKTOP
          # ========================================================

          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Type DWord `
            -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Type DWord `
            -Value 1

          Set-Service `
            -Name TermService `
            -StartupType Automatic

          Start-Service `
            -Name TermService `
            -ErrorAction SilentlyContinue

          # ========================================================
          # FIREWALL RDP
          # ========================================================

          Get-NetFirewallRule `
            -DisplayGroup 'Remote Desktop' `
            -ErrorAction SilentlyContinue |
            Enable-NetFirewallRule `
            -ErrorAction SilentlyContinue

          if (-not (Get-NetFirewallRule `
            -DisplayName 'GitHub RDP 3389' `
            -ErrorAction SilentlyContinue)) {

            New-NetFirewallRule `
              -DisplayName 'GitHub RDP 3389' `
              -Direction Inbound `
              -Protocol TCP `
              -LocalPort 3389 `
              -Action Allow `
              -Profile Any |
              Out-Null
          }

          Write-Output "RDP_USER=$env:RDP_USERNAME" >> $env:GITHUB_ENV

      # ============================================================
      # 2. BUSCAR EL ÚLTIMO RESPALDO
      # ============================================================

      - name: Find previous backup
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Write-Host "========================================"
          Write-Host " BUSCANDO RESPALDO ANTERIOR"
          Write-Host "========================================"

          New-Item `
            -ItemType Directory `
            -Path $env:BACKUP_DIR `
            -Force |
            Out-Null

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $repo = "${{ github.repository }}"

          $runsUrl = "https://api.github.com/repos/$repo/actions/runs?status=success&per_page=20"

          try {
            $runs = Invoke-RestMethod `
              -Uri $runsUrl `
              -Headers $headers `
              -Method Get

            $previousRun = $runs.workflow_runs |
              Where-Object {
                $_.id -ne [int64]"${{ github.run_id }}" `
                -and $_.name -eq "Windows RDP + Tailscale"
              } |
              Select-Object -First 1

            if ($null -eq $previousRun) {
              Write-Host "No existe una ejecución anterior válida."
              "HAS_BACKUP=false" >> $env:GITHUB_ENV
              exit 0
            }

            Write-Host "Ejecución anterior encontrada:"
            Write-Host "Run ID: $($previousRun.id)"

            $artifactsUrl = "https://api.github.com/repos/$repo/actions/runs/$($previousRun.id)/artifacts"

            $artifacts = Invoke-RestMethod `
              -Uri $artifactsUrl `
              -Headers $headers `
              -Method Get

            $backup = $artifacts.artifacts |
              Where-Object {
                $_.name -eq "windows-user-data"
                -and $_.expired -eq $false
              } |
              Select-Object -First 1

            if ($null -eq $backup) {
              Write-Host "No se encontró un respaldo válido."
              "HAS_BACKUP=false" >> $env:GITHUB_ENV
              exit 0
            }

            Write-Host "Respaldo encontrado."
            Write-Host "Artifact ID: $($backup.id)"

            $downloadUrl = "https://api.github.com/repos/$repo/actions/artifacts/$($backup.id)/zip"

            $zipPath = Join-Path $env:BACKUP_DIR "windows-user-data.zip"

            Invoke-WebRequest `
              -Uri $downloadUrl `
              -Headers $headers `
              -OutFile $zipPath

            Expand-Archive `
              -Path $zipPath `
              -DestinationPath $env:BACKUP_DIR `
              -Force

            "HAS_BACKUP=true" >> $env:GITHUB_ENV

            Write-Host "Respaldo descargado correctamente."

          }
          catch {
            Write-Host "No fue posible descargar un respaldo anterior."
            Write-Host "La sesión continuará sin restauración."
            Write-Host "Detalle: $($_.Exception.Message)"

            "HAS_BACKUP=false" >> $env:GITHUB_ENV
          }

      # ============================================================
      # 3. RESTAURAR ARCHIVOS Y CONFIGURACIONES
      # ============================================================

      - name: Restore persistent user data
        if: env.HAS_BACKUP == 'true'
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host " RESTAURANDO DATOS"
          Write-Host "========================================"

          $profilePath = "C:\Users\$env:RDP_USERNAME"

          if (-not (Test-Path $profilePath)) {
            throw "No se encontró el perfil de usuario: $profilePath"
          }

          $backupProfile = Join-Path $env:BACKUP_DIR "Profile"

          # ========================================================
          # RESTAURAR CARPETAS PERSONALES
          # ========================================================

          if (Test-Path $backupProfile) {

            Write-Host "Restaurando carpetas personales..."

            $folders = @(
              "Desktop",
              "Documents",
              "Downloads",
              "Pictures"
            )

            foreach ($folder in $folders) {

              $source = Join-Path $backupProfile $folder
              $destination = Join-Path $profilePath $folder

              if (Test-Path $source) {

                New-Item `
                  -ItemType Directory `
                  -Path $destination `
                  -Force |
                  Out-Null

                Copy-Item `
                  -Path "$source\*" `
                  -Destination $destination `
                  -Recurse `
                  -Force `
                  -ErrorAction SilentlyContinue

                Write-Host "Restaurado: $folder"
              }
            }
          }

          # ========================================================
          # RESTAURAR FOTO DE CUENTA
          # ========================================================

          $accountPicturesSource = Join-Path `
            $env:BACKUP_DIR `
            "AccountPictures"

          $accountPicturesDestination = Join-Path `
            $profilePath `
            "AppData\Roaming\Microsoft\Windows\AccountPictures"

          if (Test-Path $accountPicturesSource) {

            New-Item `
              -ItemType Directory `
              -Path $accountPicturesDestination `
              -Force |
              Out-Null

            Copy-Item `
              -Path "$accountPicturesSource\*" `
              -Destination $accountPicturesDestination `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue

            Write-Host "Foto de cuenta restaurada."
          }

          # ========================================================
          # RESTAURAR TEMAS LOCALES
          # ========================================================

          $themesSource = Join-Path `
            $env:BACKUP_DIR `
            "Themes"

          $themesDestination = Join-Path `
            $profilePath `
            "AppData\Local\Microsoft\Windows\Themes"

          if (Test-Path $themesSource) {

            New-Item `
              -ItemType Directory `
              -Path $themesDestination `
              -Force |
              Out-Null

            Copy-Item `
              -Path "$themesSource\*" `
              -Destination $themesDestination `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue

            Write-Host "Temas locales restaurados."
          }

          # ========================================================
          # RESTAURAR CACHÉ DEL WALLPAPER Y TEMAS
          # ========================================================

          $themeCacheSource = Join-Path `
            $env:BACKUP_DIR `
            "ThemeCache"

          $themeCacheDestination = Join-Path `
            $profilePath `
            "AppData\Roaming\Microsoft\Windows\Themes"

          if (Test-Path $themeCacheSource) {

            New-Item `
              -ItemType Directory `
              -Path $themeCacheDestination `
              -Force |
              Out-Null

            Copy-Item `
              -Path "$themeCacheSource\*" `
              -Destination $themeCacheDestination `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue

            Write-Host "Caché de temas/wallpaper restaurado."
          }

          # ========================================================
          # RESTAURAR CONFIGURACIÓN DE PERSONALIZACIÓN
          # ========================================================

          $registryBackup = Join-Path `
            $env:BACKUP_DIR `
            "Registry"

          $userHive = Join-Path `
            $profilePath `
            "NTUSER.DAT"

          $hiveName = "RoxiskPersist"

          if ((Test-Path $registryBackup) -and (Test-Path $userHive)) {

            Write-Host ""
            Write-Host "Restaurando configuración de Personalización..."

            reg.exe unload "HKU\$hiveName" 2>$null | Out-Null

            $loadResult = reg.exe load `
              "HKU\$hiveName" `
              "$userHive"

            if ($LASTEXITCODE -ne 0) {
              Write-Host "No fue posible cargar temporalmente el registro del usuario."
            }
            else {

              $registryFiles = Get-ChildItem `
                -Path $registryBackup `
                -Filter "*.reg" `
                -File `
                -ErrorAction SilentlyContinue

              foreach ($registryFile in $registryFiles) {

                Write-Host "Restaurando registro: $($registryFile.Name)"

                $content = Get-Content `
                  -Path $registryFile.FullName `
                  -Raw `
                  -ErrorAction SilentlyContinue

                if (-not [string]::IsNullOrWhiteSpace($content)) {

                  $content = $content.Replace(
                    "HKEY_CURRENT_USER",
                    "HKEY_USERS\$hiveName"
                  )

                  $tempReg = Join-Path `
                    $env:TEMP `
                    ("restore-" + $registryFile.Name)

                  Set-Content `
                    -Path $tempReg `
                    -Value $content `
                    -Encoding Unicode

                  reg.exe import $tempReg | Out-Null

                  Remove-Item `
                    -Path $tempReg `
                    -Force `
                    -ErrorAction SilentlyContinue
                }
              }

              reg.exe unload "HKU\$hiveName" 2>$null | Out-Null

              Write-Host "Configuración de Personalización restaurada."
            }
          }
          else {
            Write-Host "No existe respaldo de registro de Personalización."
          }

          Write-Host ""
          Write-Host "RESTAURACIÓN COMPLETADA."

      # ============================================================
      # 4. CONECTAR TAILSCALE
      # ============================================================

      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      # ============================================================
      # 5. VERIFICAR TAILSCALE Y RDP
      # ============================================================

      - name: Verify Tailscale and RDP
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host " VERIFICANDO TAILSCALE"
          Write-Host "========================================"

          $ipOutput = @(tailscale ip -4 2>&1)

          Write-Host "Salida de Tailscale:"

          $ipOutput | ForEach-Object {
            Write-Host $_
          }

          $ip = $null

          foreach ($line in $ipOutput) {

            $text = "$line".Trim()

            if ($text -match '^\d{1,3}(\.\d{1,3}){3}$') {
              $ip = $text
              break
            }
          }

          if ([string]::IsNullOrWhiteSpace($ip)) {

            Write-Host ""
            Write-Host "ERROR: No se obtuvo una IPv4 de Tailscale."

            Write-Host ""
            Write-Host "Estado de Tailscale:"

            tailscale status

            throw "No se obtuvo una IPv4 de Tailscale."
          }

          Write-Host ""
          Write-Host "IPv4 de Tailscale detectada: $ip"

          Write-Host ""
          Write-Host "========================================"
          Write-Host " VERIFICANDO SERVICIO RDP"
          Write-Host "========================================"

          $rdpService = Get-Service `
            -Name TermService `
            -ErrorAction SilentlyContinue

          if ($null -eq $rdpService) {
            throw "No existe el servicio TermService."
          }

          Write-Host "Estado de TermService: $($rdpService.Status)"

          if ($rdpService.Status -ne 'Running') {

            Write-Host "Intentando iniciar TermService..."

            Start-Service `
              -Name TermService `
              -ErrorAction SilentlyContinue

            Start-Sleep -Seconds 3

            $rdpService = Get-Service `
              -Name TermService

            Write-Host "Nuevo estado: $($rdpService.Status)"
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host " VERIFICANDO PUERTO RDP"
          Write-Host "========================================"

          $rdpReady = $false

          for ($i = 1; $i -le 15; $i++) {

            $tcp = Test-NetConnection `
              -ComputerName '127.0.0.1' `
              -Port 3389 `
              -WarningAction SilentlyContinue

            Write-Host "Intento $i/15 - TCP 3389: $($tcp.TcpTestSucceeded)"

            if ($tcp.TcpTestSucceeded) {

              $rdpReady = $true
              break
            }

            Start-Sleep -Seconds 2
          }

          if (-not $rdpReady) {

            Write-Host ""
            Write-Host "ERROR: RDP no está escuchando en TCP 3389."

            Get-NetTCPConnection `
              -State Listen `
              -ErrorAction SilentlyContinue |
              Sort-Object LocalPort |
              Format-Table -AutoSize

            Write-Host ""
            Write-Host "Reglas de Firewall RDP:"

            Get-NetFirewallRule `
              -DisplayGroup 'Remote Desktop' `
              -ErrorAction SilentlyContinue |
              Select-Object DisplayName, Enabled, Direction, Action |
              Format-Table -AutoSize

            throw "RDP (TCP 3389) no está escuchando en el runner."
          }

          Write-Host ""
          Write-Host "RDP está escuchando correctamente."

          "TAILSCALE_IPV4=$ip" >> $env:GITHUB_ENV

          $summary = @"
          ## Windows RDP listo

          **PC / Tailscale IPv4:** ${ip}:3389

          **Usuario:** $env:RDP_USERNAME

          **Contraseña:** usa el valor del secret ``RDP_PASSWORD``.

          ### Conexión

          En **Windows App**, agrega:

          `${ip}:3389`

          Tu teléfono o PC también debe estar conectado al mismo tailnet.

          ### Estado

          - Tailscale: conectado
          - IPv4: ${ip}
          - RDP: TCP 3389 escuchando
          - Usuario: $env:RDP_USERNAME
          - Administrador: Sí
          - Persistencia: habilitada
          - Personalización: habilitada
          "@

          Add-Content `
            -Path $env:GITHUB_STEP_SUMMARY `
            -Value $summary

          Write-Host ""
          Write-Host "========================================"
          Write-Host " RDP LISTO"
          Write-Host "========================================"
          Write-Host "Tailscale IPv4: $ip"
          Write-Host "Dirección RDP: ${ip}:3389"
          Write-Host "Usuario: $env:RDP_USERNAME"
          Write-Host "Administrador: Sí"
          Write-Host ""
          Write-Host "VERIFICACIÓN COMPLETADA CORRECTAMENTE."

      # ============================================================
      # 6. MANTENER LA SESIÓN
      # ============================================================

      - name: Keep session alive
        shell: pwsh
        run: |
          $minutes = [int]"${{ inputs.duration_minutes }}"

          Write-Host "Sesión RDP activa durante $minutes minutos."
          Write-Host "Cancela el workflow para terminarla antes."

          $deadline = (Get-Date).AddMinutes($minutes)

          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 30
          }

      # ============================================================
      # 7. GUARDAR DATOS PERSISTENTES
      # ============================================================

      - name: Prepare persistent backup
        if: always()
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host " PREPARANDO RESPALDO"
          Write-Host "========================================"

          $profilePath = "C:\Users\$env:RDP_USERNAME"

          if (-not (Test-Path $profilePath)) {
            Write-Host "No se encontró el perfil. No hay datos para guardar."
            exit 0
          }

          $backupRoot = "C:\PersistentBackup"
          $backupProfile = Join-Path $backupRoot "Profile"
          $registryBackup = Join-Path $backupRoot "Registry"

          Remove-Item `
            -Path $backupRoot `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $backupProfile `
            -Force |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Path $registryBackup `
            -Force |
            Out-Null

          # ========================================================
          # GUARDAR CARPETAS PERSONALES
          # ========================================================

          $folders = @(
            "Desktop",
            "Documents",
            "Downloads",
            "Pictures"
          )

          foreach ($folder in $folders) {

            $source = Join-Path $profilePath $folder
            $destination = Join-Path $backupProfile $folder

            if (Test-Path $source) {

              New-Item `
                -ItemType Directory `
                -Path $destination `
                -Force |
                Out-Null

              Copy-Item `
                -Path "$source\*" `
                -Destination $destination `
                -Recurse `
                -Force `
                -ErrorAction SilentlyContinue

              Write-Host "Guardado: $folder"
            }
          }

          # ========================================================
          # GUARDAR FOTO DE CUENTA
          # ========================================================

          $accountPicturesSource = Join-Path `
            $profilePath `
            "AppData\Roaming\Microsoft\Windows\AccountPictures"

          $accountPicturesDestination = Join-Path `
            $backupRoot `
            "AccountPictures"

          if (Test-Path $accountPicturesSource) {

            New-Item `
              -ItemType Directory `
              -Path $accountPicturesDestination `
              -Force |
              Out-Null

            Copy-Item `
              -Path "$accountPicturesSource\*" `
              -Destination $accountPicturesDestination `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue

            Write-Host "Foto de cuenta guardada."
          }

          # ========================================================
          # GUARDAR TEMAS LOCALES
          # ========================================================

          $themesSource = Join-Path `
            $profilePath `
            "AppData\Local\Microsoft\Windows\Themes"

          $themesDestination = Join-Path `
            $backupRoot `
            "Themes"

          if (Test-Path $themesSource) {

            New-Item `
              -ItemType Directory `
              -Path $themesDestination `
              -Force |
              Out-Null

            Copy-Item `
              -Path "$themesSource\*" `
              -Destination $themesDestination `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue

            Write-Host "Temas locales guardados."
          }

          # ========================================================
          # GUARDAR CACHÉ DE WALLPAPER Y TEMAS
          # ========================================================

          $themeCacheSource = Join-Path `
            $profilePath `
            "AppData\Roaming\Microsoft\Windows\Themes"

          $themeCacheDestination = Join-Path `
            $backupRoot `
            "ThemeCache"

          if (Test-Path $themeCacheSource) {

            New-Item `
              -ItemType Directory `
              -Path $themeCacheDestination `
              -Force |
              Out-Null

            Copy-Item `
              -Path "$themeCacheSource\*" `
              -Destination $themeCacheDestination `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue

            Write-Host "Caché de wallpaper/temas guardado."
          }

          # ========================================================
          # GUARDAR CONFIGURACIÓN DE PERSONALIZACIÓN
          # ========================================================

          Write-Host ""
          Write-Host "Guardando configuración de Personalización..."

          $userHive = Join-Path `
            $profilePath `
            "NTUSER.DAT"

          $hiveName = "RoxiskPersist"

          if (Test-Path $userHive) {

            # Asegurar que no exista un montaje anterior
            reg.exe unload "HKU\$hiveName" 2>$null | Out-Null

            $loadResult = reg.exe load `
              "HKU\$hiveName" `
              "$userHive"

            if ($LASTEXITCODE -ne 0) {

              Write-Host "No se pudo cargar NTUSER.DAT para guardar Personalización."

            }
            else {

              # ====================================================
              # CLAVES DE PERSONALIZACIÓN
              # ====================================================

              $registryKeys = @(
                "Control Panel\Desktop",
                "Software\Microsoft\Windows\CurrentVersion\Themes",
                "Software\Microsoft\Windows\CurrentVersion\Themes\Personalize",
                "Software\Microsoft\Windows\CurrentVersion\Explorer\Wallpapers",
                "Software\Microsoft\Windows\CurrentVersion\Explorer\Accent",
                "Software\Microsoft\Windows\DWM"
              )

              foreach ($key in $registryKeys) {

                $safeName = $key `
                  -replace '[\\/:*?"<>|]', '_' `
                  -replace ' ', '_'

                $outputFile = Join-Path `
                  $registryBackup `
                  "$safeName.reg"

                $sourceKey = "HKEY_USERS\$hiveName\$key"

                Write-Host "Guardando registro: $key"

                reg.exe export `
                  "$sourceKey" `
                  "$outputFile" `
                  /y | Out-Null

                if ($LASTEXITCODE -ne 0) {

                  Remove-Item `
                    -Path $outputFile `
                    -Force `
                    -ErrorAction SilentlyContinue

                  Write-Host "No se pudo guardar: $key"
                }
              }

              reg.exe unload "HKU\$hiveName" 2>$null | Out-Null

              Write-Host "Configuración de Personalización guardada."
            }
          }
          else {
            Write-Host "No se encontró NTUSER.DAT."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host " RESPALDO PREPARADO"
          Write-Host "========================================"

      # ============================================================
      # 8. SUBIR RESPALDO A GITHUB
      # ============================================================

      - name: Upload persistent backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-user-data
          path: C:\PersistentBackup
          if-no-files-found: ignore
          retention-days: 90
          compression-level: 6

      # ============================================================
      # 9. FINAL
      # ============================================================

      - name: Session finished
        if: always()
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host " SESIÓN FINALIZADA"
          Write-Host "========================================"
          Write-Host "Los datos seleccionados fueron enviados al respaldo."
          Write-Host "GitHub destruirá el runner temporal al finalizar el job."
