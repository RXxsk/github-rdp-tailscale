name: Windows RDP + Tailscale

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Duracion de la sesion RDP en minutos"
        required: true
        default: "60"
        type: choice
        options:
          - "5"
          - "10"
          - "15"
          - "30"
          - "45"
          - "60"
          - "90"
          - "120"
          - "150"
          - "180"
          - "210"
          - "240"
          - "270"
          - "300"
          - "330"

jobs:
  rdp:
    name: Windows RDP
    runs-on: windows-2025
    timeout-minutes: 360

    permissions:
      id-token: write
      contents: read
      actions: read

    env:
      RDP_USERNAME: Roxisk
      PERSISTENT_DIR: C:\Persistent
      BACKUP_DIR: C:\PersistentBackup

    steps:

      # ============================================================
      # CONFIGURE RDP
      # ============================================================

      - name: Configure RDP
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "CONFIGURING RDP"
          Write-Host "========================================"

          $username =$env:RDP_USERNAME
          $password =$env:RDP_PASSWORD

          if ([string]::IsNullOrWhiteSpace($password)) {
              throw "RDP_PASSWORD is not configured."
          }

          $user = Get-LocalUser -Name$username -ErrorAction SilentlyContinue

          if (-not $user) {
              Write-Host "Creating user..."

              $securePassword = ConvertTo-SecureString `
                $password `
                -AsPlainText `
                -Force

              New-LocalUser `
                -Name $username `
                -Password $securePassword `
                -FullName $username `
                -Description "Temporary RDP user"
          }
          else {
              Write-Host "User already exists."

              $securePassword = ConvertTo-SecureString `
                $password `
                -AsPlainText `
                -Force

              Set-LocalUser `
                -Name $username `
                -Password $securePassword
          }

          Enable-LocalUser -Name $username

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          Set-Service `
            -Name TermService `
            -StartupType Automatic

          Start-Service `
            -Name TermService

          Write-Host "RDP configured."
          
# ============================================================
      # FIND PREVIOUS BACKUP
      # ============================================================

      - name: Find previous backup
        id: previous-backup
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "SEARCHING FOR PREVIOUS BACKUP"
          Write-Host "========================================"

          $repo =$env:GITHUB_REPOSITORY
          $currentRun = [int64]$env:GITHUB_RUN_ID

          $headers = @{
            "Accept" = "application/vnd.github+json"
            "Authorization" = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2026-03-10"
          }

          $runsUrl = "https://api.github.com/repos/$repo/actions/runs?per_page=20"

          $runsResponse = Invoke-RestMethod `
            -Uri $runsUrl `
            -Headers $headers `
            -Method Get

          $candidateRuns = @(
            $runsResponse.workflow_runs |
              Where-Object {
                $_.id -ne $currentRun -and
                $_.name -eq "Windows RDP + Tailscale" -and
                $_.status -eq "completed"
              } |
              Sort-Object -Property created_at -Descending
          )

          $selectedArtifact = $null

          foreach ($run in $candidateRuns) {

              Write-Host "Checking run $($run.id)..."

              $artifactUrl = "https://api.github.com/repos/$repo/actions/runs/$($run.id)/artifacts?per_page=100"

              try {
                  $runArtifacts = Invoke-RestMethod `
                    -Uri $artifactUrl `
                    -Headers $headers `
                    -Method Get
              }
              catch {
                  Write-Host "Could not read artifacts from this run."
                  continue
              }

              # Filtrar artifacts válidos y dar máxima prioridad a 'checkpoint-final'
              $matchingArtifacts = @($runArtifacts.artifacts |
                  Where-Object {
                    $_.expired -eq$false -and
                    (
                      $_.name -like "windows-user-data-checkpoint-*" -or
                      $_.name -eq "windows-user-data"
                    )
                  } |
                  Sort-Object -Property @{
                    Expression = {
                      if ($_.name -eq "windows-user-data-checkpoint-final") { 99 }
                      elseif ($_.name -like "windows-user-data-checkpoint-*") { [int]($_.name -replace '\D','') }
                      else { 1 }
                    }
                  } -Descending
              )

              if ($matchingArtifacts.Count -gt 0) {

                  $selectedArtifact =$matchingArtifacts[0]

                  Write-Host ""
                  Write-Host "BACKUP FOUND"
                  Write-Host "Run: $($run.id)"
                  Write-Host "Artifact: $($selectedArtifact.name)"
                  Write-Host "Artifact ID: $($selectedArtifact.id)"
                  Write-Host ""

                  break
              }
          }

          if (-not $selectedArtifact) {

              Write-Host "No previous backup found."

              "found=false" |
                Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Append

              exit 0
          }

          $downloadUrl = "https://api.github.com/repos/$repo/actions/artifacts/$($selectedArtifact.id)/zip"

          $zipPath = Join-Path `
            $env:RUNNER_TEMP `
            "previous-backup.zip"

          $extractPath = Join-Path `
            $env:RUNNER_TEMP `
            "previous-backup"

          if (Test-Path $zipPath) {
              Remove-Item `
                $zipPath `
                -Force
          }

          if (Test-Path $extractPath) {
              Remove-Item `
                $extractPath `
                -Recurse `
                -Force
          }

          Write-Host "Downloading backup..."

          Invoke-WebRequest `
            -Uri $downloadUrl `
            -Headers $headers `
            -OutFile $zipPath

          New-Item `
            -ItemType Directory `
            -Path $extractPath `
            -Force |
            Out-Null

          Expand-Archive `
            -Path $zipPath `
            -DestinationPath $extractPath `
            -Force

          "found=true" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Append

          "path=$extractPath" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Append

          Write-Host "Backup downloaded."

      # ============================================================
      # RESTORE PERSISTENT DATA
      # ============================================================

      - name: Restore persistent user data
        if: ${{ steps.previous-backup.outputs.found == 'true' }}
        shell: powershell
        env:
          BACKUP_SOURCE: ${{ steps.previous-backup.outputs.path }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "RESTORING PERSISTENT DATA"
          Write-Host "========================================"

          $username = $env:RDP_USERNAME$profile = "C:\Users\$username"
          $source =$env:BACKUP_SOURCE

          if (-not (Test-Path $source)) {
              Write-Host "Backup directory not found."
              exit 0
          }

          New-Item `
            -ItemType Directory `
            -Path $env:PERSISTENT_DIR `
            -Force |
            Out-Null

          # --------------------------------------------------------
          # ROBocopy helper
          # Codes 0-7 are successful/non-fatal.
          # Codes 8+ are real Robocopy errors.
          # --------------------------------------------------------

          function Copy-WithRobocopy {
              param(
                  [Parameter(Mandatory = $true)]
                  [string]$SourcePath,

                  [Parameter(Mandatory = $true)]
                  [string]$DestinationPath
              )

              & robocopy `
                $SourcePath `
                $DestinationPath `
                /E `
                /COPY:DAT `
                /DCOPY:DAT `
                /R:1 `
                /W:1 `
                /XJ `
                /NFL `
                /NDL `
                /NP

              $code =$LASTEXITCODE

              Write-Host "Robocopy exit code: $code"

              if ($code -ge 8) {
                  throw "Robocopy failed with exit code $code."
              }
          }

          # --------------------------------------------------------
          # PERSONAL FOLDERS
          # --------------------------------------------------------

          $folders = @(
            "Desktop",
            "Documents",
            "Downloads",
            "Pictures"
          )

          foreach ($folder in$folders) {

              $src = Join-Path$source $folder$dst = Join-Path $profile$folder

              if (Test-Path $src) {

                  Write-Host "Restoring $folder..."

                  New-Item `
                    -ItemType Directory `
                    -Path $dst `
                    -Force |
                    Out-Null

                  Copy-WithRobocopy `
                    -SourcePath $src `
                    -DestinationPath $dst
              }
          }

          # --------------------------------------------------------
          # ACCOUNT PICTURE
          # --------------------------------------------------------

          $accountPicturesSource = Join-Path `
            $source `
            "AccountPictures"

          $accountPicturesDestination = Join-Path `
            $profile `
            "AppData\Roaming\Microsoft\Windows\AccountPictures"

          if (Test-Path $accountPicturesSource) {

              Write-Host "Restoring account picture..."

              New-Item `
                -ItemType Directory `
                -Path $accountPicturesDestination `
                -Force |
                Out-Null

              Copy-WithRobocopy `
                -SourcePath $accountPicturesSource `
                -DestinationPath $accountPicturesDestination
          }

          # --------------------------------------------------------
          # THEMES
          # --------------------------------------------------------

          $themeSource = Join-Path `
            $source `
            "Themes"

          $themeDestination = Join-Path `
            $profile `
            "AppData\Roaming\Microsoft\Windows\Themes"

          if (Test-Path $themeSource) {

              Write-Host "Restoring themes..."

              New-Item `
                -ItemType Directory `
                -Path $themeDestination `
                -Force |
                Out-Null

              Copy-WithRobocopy `
                -SourcePath $themeSource `
                -DestinationPath $themeDestination
          }

          # --------------------------------------------------------
          # THEME CACHE
          # --------------------------------------------------------

          $themeCacheSource = Join-Path `
            $source `
            "ThemeCache"

          $themeCacheDestination = Join-Path `
            $profile `
            "AppData\Local\Microsoft\Windows\Themes"

          if (Test-Path $themeCacheSource) {

              Write-Host "Restoring theme cache..."

              New-Item `
                -ItemType Directory `
                -Path $themeCacheDestination `
                -Force |
                Out-Null

              Copy-WithRobocopy `
                -SourcePath $themeCacheSource `
                -DestinationPath $themeCacheDestination
          }

          # --------------------------------------------------------
          # USER REGISTRY
          # --------------------------------------------------------

          $registryFolder = Join-Path `
            $source `
            "Registry"

          if (Test-Path $registryFolder) {

              Write-Host "Restoring registry settings..."

              $sid = (
                Get-CimInstance Win32_UserAccount |
                  Where-Object {
                    $_.Name -eq$username -and
                    $_.LocalAccount -eq$true
                  } |
                  Select-Object -ExpandProperty SID -First 1
              )

              if (-not $sid) {
                  Write-Host "Could not find user SID. Registry restore skipped."
              }
              else {

                  $hkuPath = "Registry::HKEY_USERS\$sid"
                  $mountedHiveName = "RoxiskPersist"
                  $mountedHivePath = "Registry::HKEY_USERS\$mountedHiveName"
                  $ntuser = Join-Path `
                    $profile `
                    "NTUSER.DAT"

                  $mountedByUs =$false

                  # ------------------------------------------------
                  # If the real user hive is already loaded, import
                  # directly into it.
                  # ------------------------------------------------

                  if (Test-Path $hkuPath) {

                      Write-Host "User hive is already loaded."

                      Get-ChildItem `
                        $registryFolder `
                        -Filter "*.reg" |
                        Sort-Object Name |
                        ForEach-Object {

                            Write-Host "Importing $($_.Name)..."

                            & reg.exe import $_.FullName

                            $regCode =$LASTEXITCODE

                            if ($regCode -ne 0) {
                                throw "Registry import failed for $($_.Name) with exit code$regCode."
                            }
                        }
                  }

                  # ------------------------------------------------
                  # Otherwise temporarily load NTUSER.DAT.
                  # ------------------------------------------------

                  elseif (Test-Path $ntuser) {

                      Write-Host "Loading NTUSER.DAT..."

                      if (Test-Path $mountedHivePath) {
                          Write-Host "Temporary hive already exists. Unloading it first."

                          & reg.exe unload "HKU\$mountedHiveName" | Out-Null
                      }

                      & reg.exe load `
                        "HKU\$mountedHiveName" `
                        $ntuser

                      $loadCode =$LASTEXITCODE

                      if ($loadCode -ne 0) {
                          throw "Could not load NTUSER.DAT. Exit code: $loadCode."
                      }

                      $mountedByUs =$true

                      try {

                          Get-ChildItem `
                            $registryFolder `
                            -Filter "*.reg" |
                            Sort-Object Name |
                            ForEach-Object {

                                Write-Host "Importing $($_.Name)..."

                                $tempReg = Join-Path `
                                  $env:RUNNER_TEMP `
                                  "restore-$($_.Name)"

                                # Convert the old HKEY_USERS\<SID> path
                                # to the temporary hive name.
                                $content = Get-Content `
                                  -Path $_.FullName `
                                  -Raw

                                $content =$content.Replace(
                                  "HKEY_USERS\$sid",
                                  "HKEY_USERS\$mountedHiveName"
                                )

                                Set-Content `
                                  -Path $tempReg `
                                  -Value $content `
                                  -Encoding Unicode

                                & reg.exe import $tempReg

                                $regCode = $LASTEXITCODE

                                Remove-Item `
                                  $tempReg `
                                  -Force `
                                  -ErrorAction SilentlyContinue

                                if ($regCode -ne 0) {
                                    throw "Registry import failed for $($_.Name) with exit code$regCode."
                                }
                            }
                      }
                      finally {

                          if ($mountedByUs) {

                              Write-Host "Unloading temporary user hive..."

                              & reg.exe unload `
                                "HKU\$mountedHiveName" |
                                Out-Null

                              $unloadCode = $LASTEXITCODE

                              if ($unloadCode -ne 0) {
                                  Write-Host "Warning: registry hive unload returned code $unloadCode."
                              }

                              $mountedByUs = $false
                          }
                      }
                  }
                  else {
                      Write-Host "NTUSER.DAT not found. Registry restore skipped."
                  }
              }
          }

          Write-Host "Restore completed."

          # Important:
          # Robocopy can legitimately return 1-7.
          # Force this PowerShell step to finish successfully.
          exit 0

      # ============================================================
      # TAILSCALE
      # ============================================================

      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      # ============================================================
      # VERIFY TAILSCALE AND RDP
      # ============================================================

      - name: Verify Tailscale and RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "VERIFYING TAILSCALE AND RDP"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Tailscale IPv4:"

          tailscale ip -4

          Write-Host ""
          Write-Host "TermService status:"

          Get-Service TermService |
            Select-Object Status, Name, DisplayName

          Write-Host ""
          Write-Host "Testing TCP 3389..."

          $test = Test-NetConnection `
            -ComputerName 127.0.0.1 `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $test.TcpTestSucceeded) {
              throw "TCP 3389 is not available."
          }

          Write-Host "TCP 3389: OK"

          Write-Host ""
          Write-Host "RDP READY."

      # ============================================================
      # CREATE BACKUP SCRIPT
      # ============================================================

      - name: Create backup script
        shell: powershell
        run: |
          $scriptPath = Join-Path `
            $env:RUNNER_TEMP `
            "Prepare-PersistentBackup.ps1"

          @'
          $ErrorActionPreference = "Stop"

          $username = $env:RDP_USERNAME$profile = "C:\Users\$username"
          $backup =$env:BACKUP_DIR

          Write-Host "========================================"
          Write-Host "CREATING CHECKPOINT"
          Write-Host "========================================"

          if (Test-Path $backup) {
              Remove-Item `
                $backup `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $backup `
            -Force |
            Out-Null

          # --------------------------------------------------------
          # ROBocopy helper
          # Codes 0-7 are successful/non-fatal.
          # Codes 8+ are real Robocopy errors.
          # --------------------------------------------------------

          function Copy-WithRobocopy {
              param(
                  [Parameter(Mandatory = $true)]
                  [string]$SourcePath,

                  [Parameter(Mandatory = $true)]
                  [string]$DestinationPath
              )

              & robocopy `
                $SourcePath `
                $DestinationPath `
                /E `
                /COPY:DAT `
                /DCOPY:DAT `
                /R:1 `
                /W:1 `
                /XJ `
                /NFL `
                /NDL `
                /NP

              $code = $LASTEXITCODE

              Write-Host "Robocopy exit code: $code"

              if ($code -ge 8) {
                  throw "Robocopy failed with exit code $code."
              }
          }

          # --------------------------------------------------------
          # PERSONAL FOLDERS
          # --------------------------------------------------------

          $folders = @(
            "Desktop",
            "Documents",
            "Downloads",
            "Pictures"
          )

          foreach ($folder in $folders) {

              $src = Join-Path $profile $folder
              $dst = Join-Path $backup $folder

              if (Test-Path $src) {

                  Write-Host "Saving $folder..."

                  New-Item `
                    -ItemType Directory `
                    -Path $dst `
                    -Force |
                    Out-Null

                  Copy-WithRobocopy `
                    -SourcePath $src `
                    -DestinationPath $dst
              }
          }

          # --------------------------------------------------------
          # ACCOUNT PICTURE
          # --------------------------------------------------------

          $accountPictures = Join-Path `
            $profile `
            "AppData\Roaming\Microsoft\Windows\AccountPictures"

          if (Test-Path $accountPictures) {

              $dst = Join-Path `
                $backup `
                "AccountPictures"

              New-Item `
                -ItemType Directory `
                -Path $dst `
                -Force |
                Out-Null

              Copy-WithRobocopy `
                -SourcePath $accountPictures `
                -DestinationPath $dst
          }

          # --------------------------------------------------------
          # THEMES
          # --------------------------------------------------------

          $themes = Join-Path `
            $profile `
            "AppData\Roaming\Microsoft\Windows\Themes"

          if (Test-Path $themes) {

              $dst = Join-Path `
                $backup `
                "Themes"

              New-Item `
                -ItemType Directory `
                -Path $dst `
                -Force |
                Out-Null

              Copy-WithRobocopy `
                -SourcePath $themes `
                -DestinationPath $dst
          }

          # --------------------------------------------------------
          # THEME CACHE
          # --------------------------------------------------------

          $themeCache = Join-Path `
            $profile `
            "AppData\Local\Microsoft\Windows\Themes"

          if (Test-Path $themeCache) {

              $dst = Join-Path `
                $backup `
                "ThemeCache"

              New-Item `
                -ItemType Directory `
                -Path $dst `
                -Force |
                Out-Null

              Copy-WithRobocopy `
                -SourcePath $themeCache `
                -DestinationPath $dst
          }

          # --------------------------------------------------------
          # REGISTRY
          # --------------------------------------------------------

          $registryBackup = Join-Path `
            $backup `
            "Registry"

          New-Item `
            -ItemType Directory `
            -Path $registryBackup `
            -Force |
            Out-Null

          $ntuser = Join-Path `
            $profile `
            "NTUSER.DAT"

          $sid = (
            Get-CimInstance Win32_UserAccount |
              Where-Object {
                $_.Name -eq$username -and
                $_.LocalAccount -eq$true
              } |
              Select-Object -ExpandProperty SID -First 1
          )

          $loaded =$false

          if ($sid) {

              $loadedPath = "Registry::HKEY_USERS\$sid"

              if (Test-Path $loadedPath) {

                  Write-Host "User hive is loaded."

                  $loaded =$true
              }
          }

          if ($loaded) {

              reg.exe export `
                "HKEY_USERS\$sid\Control Panel\Desktop" `
                (Join-Path $registryBackup "Desktop.reg") `
                /y |
                Out-Null

              reg.exe export `
                "HKEY_USERS\$sid\Software\Microsoft\Windows\CurrentVersion\Themes" `
                (Join-Path $registryBackup "Themes.reg") `
                /y |
                Out-Null

              reg.exe export `
                "HKEY_USERS\$sid\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" `
                (Join-Path $registryBackup "Personalize.reg") `
                /y |
                Out-Null

              reg.exe export `
                "HKEY_USERS\$sid\Software\Microsoft\Windows\CurrentVersion\Explorer\Wallpapers" `
                (Join-Path $registryBackup "Wallpapers.reg") `
                /y |
                Out-Null

              reg.exe export `
                "HKEY_USERS\$sid\Software\Microsoft\Windows\CurrentVersion\Explorer\Accent" `
                (Join-Path $registryBackup "Accent.reg") `
                /y |
                Out-Null

              reg.exe export `
                "HKEY_USERS\$sid\Software\Microsoft\Windows\DWM" `
                (Join-Path $registryBackup "DWM.reg") `
                /y |
                Out-Null
          }
          elseif (Test-Path $ntuser) {

              Write-Host "Loading NTUSER.DAT..."

              reg.exe load `
                "HKU\RoxiskPersist" `
                $ntuser |
                Out-Null

              $loadCode =$LASTEXITCODE

              if ($loadCode -eq 0) {

                  reg.exe export `
                    "HKEY_USERS\RoxiskPersist\Control Panel\Desktop" `
                    (Join-Path $registryBackup "Desktop.reg") `
                    /y |
                    Out-Null

                  reg.exe export `
                    "HKEY_USERS\RoxiskPersist\Software\Microsoft\Windows\CurrentVersion\Themes" `
                    (Join-Path $registryBackup "Themes.reg") `
                    /y |
                    Out-Null

                  reg.exe export `
                    "HKEY_USERS\RoxiskPersist\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" `
                    (Join-Path $registryBackup "Personalize.reg") `
                    /y |
                    Out-Null

                  reg.exe export `
                    "HKEY_USERS\RoxiskPersist\Software\Microsoft\Windows\CurrentVersion\Explorer\Wallpapers" `
                    (Join-Path $registryBackup "Wallpapers.reg") `
                    /y |
                    Out-Null

                  reg.exe export `
                    "HKEY_USERS\RoxiskPersist\Software\Microsoft\Windows\CurrentVersion\Explorer\Accent" `
                    (Join-Path $registryBackup "Accent.reg") `
                    /y |
                    Out-Null

                  reg.exe export `
                    "HKEY_USERS\RoxiskPersist\Software\Microsoft\Windows\DWM" `
                    (Join-Path $registryBackup "DWM.reg") `
                    /y |
                    Out-Null

                  reg.exe unload `
                    "HKU\RoxiskPersist" |
                    Out-Null
              }
              else {
                  Write-Host "Could not load NTUSER.DAT. Registry backup skipped."
              }
          }

          Write-Host "Checkpoint prepared."

          # Explicit success so Robocopy codes 1-7
          # never become the final script exit code.
          exit 0

          '@ |
            Set-Content `
              -Path $scriptPath `
              -Encoding UTF8

          Write-Host "Backup script created."

      # ============================================================
      # KEEP RDP SESSION ALIVE
      # ============================================================

      - name: Keep RDP session alive
        id: keep-session
        shell: powershell
        background: true
        timeout-minutes: 340
        env:
          DURATION_MINUTES: ${{ inputs.duration_minutes }}
        run: |
          $minutes = [int]$env:DURATION_MINUTES

          Write-Host "========================================"
          Write-Host "RDP SESSION ACTIVE"
          Write-Host "Duration: $minutes minutes"
          Write-Host "========================================"

          Start-Sleep -Seconds ($minutes * 60)

      # ============================================================
      # CHECKPOINT 45
      # ============================================================

      - name: Checkpoint 45 minutes
        if: ${{ fromJSON(inputs.duration_minutes) >= 45 }}
        shell: powershell
        run: |
          Start-Sleep -Seconds (45 * 60)

          & "$env:RUNNER_TEMP\Prepare-PersistentBackup.ps1"

      - name: Upload checkpoint 01
        if: ${{ fromJSON(inputs.duration_minutes) >= 45 }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: windows-user-data-checkpoint-01
          path: C:\PersistentBackup
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      # ============================================================
      # CHECKPOINT 90
      # ============================================================

      - name: Checkpoint 90 minutes
        if: ${{ fromJSON(inputs.duration_minutes) >= 90 }}
        shell: powershell
        run: |
          Start-Sleep -Seconds (45 * 60)

          & "$env:RUNNER_TEMP\Prepare-PersistentBackup.ps1"

      - name: Upload checkpoint 02
        if: ${{ fromJSON(inputs.duration_minutes) >= 90 }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: windows-user-data-checkpoint-02
          path: C:\PersistentBackup
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      # ============================================================
      # CHECKPOINT 135
      # ============================================================

      - name: Checkpoint 135 minutes
        if: ${{ fromJSON(inputs.duration_minutes) >= 135 }}
        shell: powershell
        run: |
          Start-Sleep -Seconds (45 * 60)

          & "$env:RUNNER_TEMP\Prepare-PersistentBackup.ps1"

      - name: Upload checkpoint 03
        if: ${{ fromJSON(inputs.duration_minutes) >= 135 }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: windows-user-data-checkpoint-03
          path: C:\PersistentBackup
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      # ============================================================
      # CHECKPOINT 180
      # ============================================================

      - name: Checkpoint 180 minutes
        if: ${{ fromJSON(inputs.duration_minutes) >= 180 }}
        shell: powershell
        run: |
          Start-Sleep -Seconds (45 * 60)

          & "$env:RUNNER_TEMP\Prepare-PersistentBackup.ps1"

      - name: Upload checkpoint 04
        if: ${{ fromJSON(inputs.duration_minutes) >= 180 }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: windows-user-data-checkpoint-04
          path: C:\PersistentBackup
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      # ============================================================
      # CHECKPOINT 225
      # ============================================================

      - name: Checkpoint 225 minutes
        if: ${{ fromJSON(inputs.duration_minutes) >= 225 }}
        shell: powershell
        run: |
          Start-Sleep -Seconds (45 * 60)

          & "$env:RUNNER_TEMP\Prepare-PersistentBackup.ps1"

      - name: Upload checkpoint 05
        if: ${{ fromJSON(inputs.duration_minutes) >= 225 }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: windows-user-data-checkpoint-05
          path: C:\PersistentBackup
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      # ============================================================
      # CHECKPOINT 270
      # ============================================================

      - name: Checkpoint 270 minutes
        if: ${{ fromJSON(inputs.duration_minutes) >= 270 }}
        shell: powershell
        run: |
          Start-Sleep -Seconds (45 * 60)

          & "$env:RUNNER_TEMP\Prepare-PersistentBackup.ps1"

      - name: Upload checkpoint 06
        if: ${{ fromJSON(inputs.duration_minutes) >= 270 }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: windows-user-data-checkpoint-06
          path: C:\PersistentBackup
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      # ============================================================
      # CHECKPOINT 315
      # ============================================================

      - name: Checkpoint 315 minutes
        if: ${{ fromJSON(inputs.duration_minutes) >= 315 }}
        shell: powershell
        run: |
          Start-Sleep -Seconds (45 * 60)

          & "$env:RUNNER_TEMP\Prepare-PersistentBackup.ps1"

      - name: Upload checkpoint 07
        if: ${{ fromJSON(inputs.duration_minutes) >= 315 }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: windows-user-data-checkpoint-07
          path: C:\PersistentBackup
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      # ============================================================
      # FINAL CHECKPOINT
      # ============================================================

      - name: Final checkpoint
        shell: powershell
        env:
          DURATION_MINUTES: ${{ inputs.duration_minutes }}
        run: |
          $minutes = [int]$env:DURATION_MINUTES

          $checkpointTimes = @(
            45,
            90,
            135,
            180,
            225,
            270,
            315
          )

          $lastCheckpoint = 0

          foreach ($checkpoint in $checkpointTimes) {

              if ($minutes -ge $checkpoint) {
                  $lastCheckpoint = $checkpoint
              }
          }

          $remaining = $minutes - $lastCheckpoint

          if ($remaining -gt 0) {

              Write-Host "Waiting $remaining minutes for final checkpoint..."

              Start-Sleep `
                -Seconds ($remaining * 60)
          }

          & "$env:RUNNER_TEMP\Prepare-PersistentBackup.ps1"

      # ============================================================
      # UPLOAD FINAL BACKUP
      # ============================================================

      - name: Upload final checkpoint
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: windows-user-data-checkpoint-final
          path: C:\PersistentBackup
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      # ============================================================
      # FINISH
      # ============================================================

      - name: Finish RDP session
        wait: keep-session
