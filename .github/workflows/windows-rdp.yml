name: Windows RDP + Tailscale

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Tiempo de la sesión RDP (5-330 minutos)"
        required: true
        default: "60"
        type: string

jobs:
  rdp:

    runs-on: windows-2025
    timeout-minutes: 360

    permissions:
      id-token: write
      contents: read
      actions: read

    env:
      RDP_USERNAME: Roxisk
      PERSISTENT_DIR: C:\Persistent
      BACKUP_DIR: C:\PersistentBackup

    steps:

      # ============================================================
      # 1. CONFIGURAR RDP
      # ============================================================

      - name: Configure RDP
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $minutes = [int]"${{ inputs.duration_minutes }}"

          if ($minutes -lt 5 -or $minutes -gt 330) {
            throw "duration_minutes debe estar entre 5 y 330."
          }

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Falta el secret RDP_PASSWORD."
          }

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser `
            -Name $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          if ($null -eq $existing) {

            New-LocalUser `
              -Name $env:RDP_USERNAME `
              -Password $securePassword `
              -AccountNeverExpires `
              -PasswordNeverExpires `
              -UserMayNotChangePassword `
              -Description "Temporary GitHub Actions RDP administrator"

          }
          else {

            Set-LocalUser `
              -Name $env:RDP_USERNAME `
              -Password $securePassword

            Enable-LocalUser `
              -Name $env:RDP_USERNAME
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $env:PERSISTENT_DIR `
            -Force |
            Out-Null

          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Type DWord `
            -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Type DWord `
            -Value 1

          Set-Service `
            -Name TermService `
            -StartupType Automatic

          Start-Service `
            -Name TermService `
            -ErrorAction SilentlyContinue

          Get-NetFirewallRule `
            -DisplayGroup 'Remote Desktop' `
            -ErrorAction SilentlyContinue |
            Enable-NetFirewallRule `
            -ErrorAction SilentlyContinue

          if (-not (Get-NetFirewallRule `
            -DisplayName 'GitHub RDP 3389' `
            -ErrorAction SilentlyContinue)) {

            New-NetFirewallRule `
              -DisplayName 'GitHub RDP 3389' `
              -Direction Inbound `
              -Protocol TCP `
              -LocalPort 3389 `
              -Action Allow `
              -Profile Any |
              Out-Null
          }

          "RDP_USER=$env:RDP_USERNAME" >> $env:GITHUB_ENV

      # ============================================================
      # 2. BUSCAR EL ÚLTIMO CHECKPOINT
      # ============================================================

      - name: Find previous backup
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Write-Host "========================================"
          Write-Host " BUSCANDO ÚLTIMO RESPALDO"
          Write-Host "========================================"

          New-Item `
            -ItemType Directory `
            -Path $env:BACKUP_DIR `
            -Force |
            Out-Null

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $repo = "${{ github.repository }}"

          # Buscar ejecuciones completadas, incluyendo failed/cancelled.
          $runsUrl = `
            "https://api.github.com/repos/$repo/actions/runs?status=completed&per_page=50"

          try {

            $runs = Invoke-RestMethod `
              -Uri $runsUrl `
              -Headers $headers `
              -Method Get

            $previousRun = $runs.workflow_runs |
              Where-Object {
                $_.id -ne [int64]"${{ github.run_id }}" `
                -and $_.name -eq "Windows RDP + Tailscale"
              } |
              Sort-Object created_at -Descending |
              Select-Object -First 1

            if ($null -eq $previousRun) {

              Write-Host "No existe una ejecución anterior."
              "HAS_BACKUP=false" >> $env:GITHUB_ENV
              exit 0
            }

            Write-Host "Ejecución anterior:"
            Write-Host "Run ID: $($previousRun.id)"
            Write-Host "Conclusión: $($previousRun.conclusion)"

            $artifactsUrl = `
              "https://api.github.com/repos/$repo/actions/runs/$($previousRun.id)/artifacts?per_page=100"

            $artifacts = Invoke-RestMethod `
              -Uri $artifactsUrl `
              -Headers $headers `
              -Method Get

            # ========================================================
            # BUSCAR CHECKPOINTS NUEVOS
            # ========================================================

            $backup = $artifacts.artifacts |
              Where-Object {
                $_.expired -eq $false `
                -and (
                  $_.name -like "windows-user-data-checkpoint-*"
                  -or $_.name -eq "windows-user-data"
                )
              } |
              Sort-Object created_at -Descending |
              Select-Object -First 1

            if ($null -eq $backup) {

              Write-Host "No se encontró ningún checkpoint."
              "HAS_BACKUP=false" >> $env:GITHUB_ENV
              exit 0
            }

            Write-Host ""
            Write-Host "RESPALDO ENCONTRADO"
            Write-Host "Nombre: $($backup.name)"
            Write-Host "Artifact ID: $($backup.id)"
            Write-Host "Creado: $($backup.created_at)"

            $downloadUrl = `
              "https://api.github.com/repos/$repo/actions/artifacts/$($backup.id)/zip"

            $zipPath = Join-Path `
              $env:BACKUP_DIR `
              "windows-user-data.zip"

            Invoke-WebRequest `
              -Uri $downloadUrl `
              -Headers $headers `
              -OutFile $zipPath

            Expand-Archive `
              -Path $zipPath `
              -DestinationPath $env:BACKUP_DIR `
              -Force

            Remove-Item `
              -Path $zipPath `
              -Force `
              -ErrorAction SilentlyContinue

            "HAS_BACKUP=true" >> $env:GITHUB_ENV

            Write-Host ""
            Write-Host "Respaldo descargado correctamente."

          }
          catch {

            Write-Host ""
            Write-Host "No fue posible descargar el respaldo."
            Write-Host "La sesión continuará sin restauración."
            Write-Host "Detalle: $($_.Exception.Message)"

            "HAS_BACKUP=false" >> $env:GITHUB_ENV
          }

      # ============================================================
      # 3. RESTAURAR ARCHIVOS Y CONFIGURACIONES
      # ============================================================

      - name: Restore persistent user data
        if: ${{ env.HAS_BACKUP == 'true' }}
        shell: pwsh
        run: |

          Write-Host "========================================"
          Write-Host " RESTAURANDO DATOS"
          Write-Host "========================================"

          $profilePath = "C:\Users\$env:RDP_USERNAME"

          if (-not (Test-Path $profilePath)) {
            throw "No se encontró el perfil: $profilePath"
          }

          $backupProfile = `
            Join-Path $env:BACKUP_DIR "Profile"

          # ========================================================
          # CARPETAS PERSONALES
          # ========================================================

          if (Test-Path $backupProfile) {

            $folders = @(
              "Desktop",
              "Documents",
              "Downloads",
              "Pictures"
            )

            foreach ($folder in $folders) {

              $source = Join-Path `
                $backupProfile `
                $folder

              $destination = Join-Path `
                $profilePath `
                $folder

              if (Test-Path $source) {

                New-Item `
                  -ItemType Directory `
                  -Path $destination `
                  -Force |
                  Out-Null

                Copy-Item `
                  -Path "$source\*" `
                  -Destination $destination `
                  -Recurse `
                  -Force `
                  -ErrorAction SilentlyContinue

                Write-Host "Restaurado: $folder"
              }
            }
          }

          # ========================================================
          # FOTO DE CUENTA
          # ========================================================

          $accountPicturesSource = Join-Path `
            $env:BACKUP_DIR `
            "AccountPictures"

          $accountPicturesDestination = Join-Path `
            $profilePath `
            "AppData\Roaming\Microsoft\Windows\AccountPictures"

          if (Test-Path $accountPicturesSource) {

            New-Item `
              -ItemType Directory `
              -Path $accountPicturesDestination `
              -Force |
              Out-Null

            Copy-Item `
              -Path "$accountPicturesSource\*" `
              -Destination $accountPicturesDestination `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue

            Write-Host "Foto de cuenta restaurada."
          }

          # ========================================================
          # TEMAS LOCALES
          # ========================================================

          $themesSource = Join-Path `
            $env:BACKUP_DIR `
            "Themes"

          $themesDestination = Join-Path `
            $profilePath `
            "AppData\Local\Microsoft\Windows\Themes"

          if (Test-Path $themesSource) {

            New-Item `
              -ItemType Directory `
              -Path $themesDestination `
              -Force |
              Out-Null

            Copy-Item `
              -Path "$themesSource\*" `
              -Destination $themesDestination `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue

            Write-Host "Temas locales restaurados."
          }

          # ========================================================
          # CACHE DE TEMAS / WALLPAPER
          # ========================================================

          $themeCacheSource = Join-Path `
            $env:BACKUP_DIR `
            "ThemeCache"

          $themeCacheDestination = Join-Path `
            $profilePath `
            "AppData\Roaming\Microsoft\Windows\Themes"

          if (Test-Path $themeCacheSource) {

            New-Item `
              -ItemType Directory `
              -Path $themeCacheDestination `
              -Force |
              Out-Null

            Copy-Item `
              -Path "$themeCacheSource\*" `
              -Destination $themeCacheDestination `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue

            Write-Host "Cache de temas restaurado."
          }

          # ========================================================
          # RESTAURAR REGISTRO DE PERSONALIZACIÓN
          # ========================================================

          $registryBackup = `
            Join-Path $env:BACKUP_DIR "Registry"

          $userHive = `
            Join-Path $profilePath "NTUSER.DAT"

          $tempHiveName = "RoxiskPersist"

          if ((Test-Path $registryBackup) -and (Test-Path $userHive)) {

            Write-Host ""
            Write-Host "Restaurando Personalización..."

            $user = Get-LocalUser `
              -Name $env:RDP_USERNAME

            $sid = $user.SID.Value

            $sidRegistryPath = `
              "Registry::HKEY_USERS\$sid"

            $hiveWasAlreadyLoaded = `
              Test-Path $sidRegistryPath

            $targetRoot = $null
            $loadedTemporaryHive = $false

            if ($hiveWasAlreadyLoaded) {

              Write-Host "El hive del usuario ya está cargado."

              $targetRoot = "HKEY_USERS\$sid"

            }
            else {

              Write-Host "Cargando NTUSER.DAT temporalmente..."

              reg.exe unload `
                "HKU\$tempHiveName" `
                2>$null |
                Out-Null

              reg.exe load `
                "HKU\$tempHiveName" `
                "$userHive" |
                Out-Null

              if ($LASTEXITCODE -eq 0) {

                $targetRoot = `
                  "HKEY_USERS\$tempHiveName"

                $loadedTemporaryHive = $true

                Write-Host "NTUSER.DAT cargado."
              }
              else {

                Write-Host "No se pudo cargar NTUSER.DAT."
              }
            }

            if ($null -ne $targetRoot) {

              $registryFiles = Get-ChildItem `
                -Path $registryBackup `
                -Filter "*.reg" `
                -File `
                -ErrorAction SilentlyContinue

              foreach ($registryFile in $registryFiles) {

                Write-Host `
                  "Restaurando: $($registryFile.Name)"

                $content = Get-Content `
                  -Path $registryFile.FullName `
                  -Raw `
                  -ErrorAction SilentlyContinue

                if (-not [string]::IsNullOrWhiteSpace($content)) {

                  $content = $content.Replace(
                    "HKEY_CURRENT_USER",
                    $targetRoot
                  )

                  $tempReg = Join-Path `
                    $env:TEMP `
                    ("restore-" + $registryFile.Name)

                  Set-Content `
                    -Path $tempReg `
                    -Value $content `
                    -Encoding Unicode

                  reg.exe import `
                    "$tempReg" |
                    Out-Null

                  Remove-Item `
                    -Path $tempReg `
                    -Force `
                    -ErrorAction SilentlyContinue
                }
              }

              Write-Host "Registro de Personalización restaurado."
            }

            if ($loadedTemporaryHive) {

              reg.exe unload `
                "HKU\$tempHiveName" `
                2>$null |
                Out-Null
            }
          }
          else {

            Write-Host "No existe respaldo de registro."
          }

          Write-Host ""
          Write-Host "RESTAURACIÓN COMPLETADA."

      # ============================================================
      # 4. CONECTAR TAILSCALE
      # ============================================================

      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      # ============================================================
      # 5. VERIFICAR TAILSCALE Y RDP
      # ============================================================

      - name: Verify Tailscale and RDP
        shell: pwsh
        run: |

          Write-Host "========================================"
          Write-Host " VERIFICANDO TAILSCALE"
          Write-Host "========================================"

          $ipOutput = @(tailscale ip -4 2>&1)

          $ipOutput | ForEach-Object {
            Write-Host $_
          }

          $ip = $null

          foreach ($line in $ipOutput) {

            $text = "$line".Trim()

            if ($text -match '^\d{1,3}(\.\d{1,3}){3}$') {

              $ip = $text
              break
            }
          }

          if ([string]::IsNullOrWhiteSpace($ip)) {

            tailscale status

            throw "No se obtuvo una IPv4 de Tailscale."
          }

          Write-Host ""
          Write-Host "IPv4 de Tailscale: $ip"

          # ========================================================
          # RDP
          # ========================================================

          $rdpService = Get-Service `
            -Name TermService `
            -ErrorAction SilentlyContinue

          if ($null -eq $rdpService) {
            throw "No existe TermService."
          }

          Write-Host "TermService: $($rdpService.Status)"

          if ($rdpService.Status -ne 'Running') {

            Start-Service `
              -Name TermService `
              -ErrorAction SilentlyContinue

            Start-Sleep -Seconds 3
          }

          # ========================================================
          # PUERTO 3389
          # ========================================================

          $rdpReady = $false

          for ($i = 1; $i -le 15; $i++) {

            $tcp = Test-NetConnection `
              -ComputerName '127.0.0.1' `
              -Port 3389 `
              -WarningAction SilentlyContinue

            Write-Host `
              "Intento $i/15 - TCP 3389: $($tcp.TcpTestSucceeded)"

            if ($tcp.TcpTestSucceeded) {

              $rdpReady = $true
              break
            }

            Start-Sleep -Seconds 2
          }

          if (-not $rdpReady) {

            Get-NetTCPConnection `
              -State Listen `
              -ErrorAction SilentlyContinue |
              Sort-Object LocalPort |
              Format-Table -AutoSize

            throw "RDP no está escuchando en TCP 3389."
          }

          "TAILSCALE_IPV4=$ip" >> $env:GITHUB_ENV

          $summary = @"
          ## Windows RDP listo

          **PC / Tailscale IPv4:** ${ip}:3389

          **Usuario:** $env:RDP_USERNAME

          **Contraseña:** usa el secret ``RDP_PASSWORD``.

          ### Conexión

          En Windows App agrega:

          `${ip}:3389`

          Tu dispositivo debe estar conectado al mismo tailnet.

          ### Estado

          - Tailscale: conectado
          - IPv4: ${ip}
          - RDP: TCP 3389 escuchando
          - Usuario: $env:RDP_USERNAME
          - Administrador: Sí
          - Persistencia: habilitada
          - Checkpoints: cada 45 minutos
          "@

          Add-Content `
            -Path $env:GITHUB_STEP_SUMMARY `
            -Value $summary

          Write-Host ""
          Write-Host "========================================"
          Write-Host " RDP LISTO"
          Write-Host "========================================"
          Write-Host "Tailscale IPv4: $ip"
          Write-Host "Dirección RDP: ${ip}:3389"
          Write-Host "Usuario: $env:RDP_USERNAME"
          Write-Host "Administrador: Sí"

      # ============================================================
      # 6. INICIAR RELOJ DE SESIÓN
      # ============================================================

      - name: Initialize session clock
        shell: pwsh
        run: |

          $sessionStart = Get-Date

          "SESSION_START=$($sessionStart.ToString('o'))" `
            >> $env:GITHUB_ENV

          Write-Host "Inicio de sesión: $sessionStart"
          Write-Host "Duración: ${{ inputs.duration_minutes }} minutos."

      # ============================================================
      # 7. CREAR SCRIPT DE RESPALDO
      # ============================================================

      - name: Create backup script
        shell: pwsh
        run: |

          $scriptPath = Join-Path `
            $env:RUNNER_TEMP `
            "Prepare-PersistentBackup.ps1"

          @'
          $ErrorActionPreference = "Continue"

          Write-Host "========================================"
          Write-Host " PREPARANDO CHECKPOINT"
          Write-Host "========================================"

          $profilePath = "C:\Users\$env:RDP_USERNAME"

          if (-not (Test-Path $profilePath)) {

            Write-Host "Perfil no encontrado."
            exit 0
          }

          $backupRoot = "C:\PersistentBackup"

          $backupProfile = `
            Join-Path $backupRoot "Profile"

          $registryBackup = `
            Join-Path $backupRoot "Registry"

          Remove-Item `
            -Path $backupRoot `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $backupProfile `
            -Force |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Path $registryBackup `
            -Force |
            Out-Null

          # ========================================================
          # CARPETAS PERSONALES
          # ========================================================

          $folders = @(
            "Desktop",
            "Documents",
            "Downloads",
            "Pictures"
          )

          foreach ($folder in $folders) {

            $source = Join-Path `
              $profilePath `
              $folder

            $destination = Join-Path `
              $backupProfile `
              $folder

            if (Test-Path $source) {

              New-Item `
                -ItemType Directory `
                -Path $destination `
                -Force |
                Out-Null

              Copy-Item `
                -Path "$source\*" `
                -Destination $destination `
                -Recurse `
                -Force `
                -ErrorAction SilentlyContinue

              Write-Host "Guardado: $folder"
            }
          }

          # ========================================================
          # FOTO DE CUENTA
          # ========================================================

          $accountPicturesSource = Join-Path `
            $profilePath `
            "AppData\Roaming\Microsoft\Windows\AccountPictures"

          $accountPicturesDestination = `
            Join-Path $backupRoot "AccountPictures"

          if (Test-Path $accountPicturesSource) {

            New-Item `
              -ItemType Directory `
              -Path $accountPicturesDestination `
              -Force |
              Out-Null

            Copy-Item `
              -Path "$accountPicturesSource\*" `
              -Destination $accountPicturesDestination `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue

            Write-Host "Guardado: foto de cuenta."
          }

          # ========================================================
          # TEMAS LOCALES
          # ========================================================

          $themesSource = Join-Path `
            $profilePath `
            "AppData\Local\Microsoft\Windows\Themes"

          $themesDestination = `
            Join-Path $backupRoot "Themes"

          if (Test-Path $themesSource) {

            New-Item `
              -ItemType Directory `
              -Path $themesDestination `
              -Force |
              Out-Null

            Copy-Item `
              -Path "$themesSource\*" `
              -Destination $themesDestination `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue

            Write-Host "Guardado: temas locales."
          }

          # ========================================================
          # CACHE DE WALLPAPER / TEMAS
          # ========================================================

          $themeCacheSource = Join-Path `
            $profilePath `
            "AppData\Roaming\Microsoft\Windows\Themes"

          $themeCacheDestination = `
            Join-Path $backupRoot "ThemeCache"

          if (Test-Path $themeCacheSource) {

            New-Item `
              -ItemType Directory `
              -Path $themeCacheDestination `
              -Force |
              Out-Null

            Copy-Item `
              -Path "$themeCacheSource\*" `
              -Destination $themeCacheDestination `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue

            Write-Host "Guardado: cache de wallpaper/temas."
          }

          # ========================================================
          # REGISTRO DE PERSONALIZACIÓN
          # ========================================================

          Write-Host ""
          Write-Host "Guardando configuración de Personalización..."

          $userHive = `
            Join-Path $profilePath "NTUSER.DAT"

          if (Test-Path $userHive) {

            $user = Get-LocalUser `
              -Name $env:RDP_USERNAME

            $sid = $user.SID.Value

            $sidRegistryPath = `
              "Registry::HKEY_USERS\$sid"

            $hiveWasAlreadyLoaded = `
              Test-Path $sidRegistryPath

            $sourceRoot = $null
            $loadedTemporaryHive = $false
            $tempHiveName = "RoxiskPersist"

            if ($hiveWasAlreadyLoaded) {

              Write-Host "Hive del usuario ya está cargado."

              $sourceRoot = "HKEY_USERS\$sid"
            }
            else {

              Write-Host "Cargando NTUSER.DAT..."

              reg.exe unload `
                "HKU\$tempHiveName" `
                2>$null |
                Out-Null

              reg.exe load `
                "HKU\$tempHiveName" `
                "$userHive" |
                Out-Null

              if ($LASTEXITCODE -eq 0) {

                $sourceRoot = `
                  "HKEY_USERS\$tempHiveName"

                $loadedTemporaryHive = $true

                Write-Host "NTUSER.DAT cargado correctamente."
              }
              else {

                Write-Host "No se pudo cargar NTUSER.DAT."
              }
            }

            if ($null -ne $sourceRoot) {

              $registryKeys = @(
                "Control Panel\Desktop",
                "Software\Microsoft\Windows\CurrentVersion\Themes",
                "Software\Microsoft\Windows\CurrentVersion\Themes\Personalize",
                "Software\Microsoft\Windows\CurrentVersion\Explorer\Wallpapers",
                "Software\Microsoft\Windows\CurrentVersion\Explorer\Accent",
                "Software\Microsoft\Windows\DWM"
              )

              foreach ($key in $registryKeys) {

                $safeName = $key `
                  -replace '[\\/:*?"<>|]', '_' `
                  -replace ' ', '_'

                $outputFile = Join-Path `
                  $registryBackup `
                  "$safeName.reg"

                $sourceKey = `
                  "$sourceRoot\$key"

                Write-Host "Guardando registro: $key"

                reg.exe export `
                  "$sourceKey" `
                  "$outputFile" `
                  /y |
                  Out-Null

                if ($LASTEXITCODE -eq 0) {

                  $content = Get-Content `
                    -Path $outputFile `
                    -Raw `
                    -ErrorAction SilentlyContinue

                  if (-not [string]::IsNullOrWhiteSpace($content)) {

                    $content = $content.Replace(
                      $sourceRoot,
                      "HKEY_CURRENT_USER"
                    )

                    Set-Content `
                      -Path $outputFile `
                      -Value $content `
                      -Encoding Unicode
                  }

                  Write-Host "Guardado: $key"
                }
                else {

                  Remove-Item `
                    -Path $outputFile `
                    -Force `
                    -ErrorAction SilentlyContinue

                  Write-Host "No se pudo guardar: $key"
                }
              }
            }

            if ($loadedTemporaryHive) {

              reg.exe unload `
                "HKU\$tempHiveName" `
                2>$null |
                Out-Null
            }
          }
          else {

            Write-Host "No se encontró NTUSER.DAT."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host " CHECKPOINT PREPARADO"
          Write-Host "========================================"

          '@ | Set-Content `
            -Path $scriptPath `
            -Encoding UTF8

          "BACKUP_SCRIPT_PATH=$scriptPath" >> $env:GITHUB_ENV

          Write-Host "Script creado:"
          Write-Host $scriptPath

      # ============================================================
      # 8. MANTENER RDP ACTIVO EN SEGUNDO PLANO
      # ============================================================

      - name: Keep session alive
        id: keep-session
        shell: pwsh
        timeout-minutes: 350
        continue-on-error: true
        background: true
        run: |

          $minutes = [int]"${{ inputs.duration_minutes }}"

          Write-Host "========================================"
          Write-Host " SESIÓN RDP ACTIVA"
          Write-Host "========================================"

          Write-Host "Duración: $minutes minutos."

          $deadline = `
            (Get-Date).AddMinutes($minutes)

          while ((Get-Date) -lt $deadline) {

            Start-Sleep -Seconds 30
          }

          Write-Host "Tiempo de sesión terminado."

      # ============================================================
      # CHECKPOINT 1 - 45 MINUTOS
      # ============================================================

      - name: Wait for checkpoint 01
